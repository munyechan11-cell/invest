# 1분봉 데이트레이딩 — dryrun + 대시보드 수동개입 테스트
name: scalp-1m-csv
mode: dry_run

data:
  provider: csv
  params: {directory: /tmp/dt1m_data}
  timeframe: 1m
  warmup_bars: 200

universe:
  symbols:
    - {ticker: AAA, venue: SIM, tick_size: 1, lot_size: 1}
    - {ticker: BBB, venue: SIM, tick_size: 1, lot_size: 1}
    - {ticker: CCC, venue: SIM, tick_size: 1, lot_size: 1}

alpha:
  - {type: ema_cross, params: {fast: 5, slow: 20, adx_min: 15, hold_bars: 10}}

portfolio:
  starting_cash: 10000000
  base_currency: KRW
  model: {type: vol_target, params: {target_annual_vol: 0.30, lookback: 60}}
  max_position_weight: 0.35
  max_gross_leverage: 0.9
  cash_reserve_pct: 0.02
  allow_short: false

risk:
  models:
    - {type: max_dd_per_security, params: {max_drawdown_pct: 0.02, lock_bars: 3}}
    - {type: max_positions, params: {max_positions: 3}}

execution:
  model: {type: immediate}
  min_order_notional: 1000

costs:
  preset: kr_equity

broker:
  type: paper
  max_order_notional: 5000000

limits:
  max_daily_notional: 50000000
  max_daily_orders: 100
  max_daily_loss_pct: 0.05
  timezone_offset_hours: 9
