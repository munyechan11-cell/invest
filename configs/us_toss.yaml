# 토스증권 미국주식 — 상대강도 상위 + 추세 확인.
#
#   python -m quant validate configs/us_toss.yaml
#   python -m quant dryrun   configs/us_toss.yaml     ← 반드시 여기서 충분히 검증
#
# `us_equity.yaml` 과 같은 시장을 다루지만 **시세 출처가 다릅니다.** 그쪽은
# 야후(15분 지연)라 백테스트용이고, 이건 토스 Open API 라 실시간입니다.
# 지연 시세로 실시간 매매를 하면 화면에서 본 가격과 주문이 닿는 가격이
# 달라지고, 그 차이는 손실로만 나타납니다.
#
# 🔴 **실거래입니다.** 이 설정으로 시작하면 진짜 주문이 나가고 진짜 돈이
#    움직입니다. 토스에는 모의투자 환경이 없어서 되돌릴 수 있는 것이 없습니다.
#    연습하려면 `mode: dry_run` 으로 바꾸세요.
#
# ⚠️ 미국 시장은 한국 시간 밤에 열립니다(서머타임 22:30~05:00, 그 외 23:30~06:00).
#    낮에 시작하면 봉이 갱신되지 않는 것이 정상이고, 봇은 다음 개장을 기다립니다.
name: us-toss-momentum
label_ko: "미국 · AI 자동매매 (토스)"
description: 미국 대형주 상대강도 상위 + 추세 확인, 실시간 시세(토스).
mode: live

data:
  provider: toss
  params: {client_id: "${TOSS_CLIENT_ID}", client_secret: "${TOSS_CLIENT_SECRET}"}
  timeframe: 1d
  warmup_bars: 300
  calendar: us_equity

universe:
  # 토스는 6자리 숫자가 아니면 미국 종목으로 봅니다. 호가단위 $0.01,
  # 최소 1주 — 국내와 달리 상하한가가 없습니다.
  benchmark: SPY
  symbols:
    - {ticker: AAPL,  venue: toss, quote_currency: USD, tick_size: 0.01, lot_size: 1}
    - {ticker: MSFT,  venue: toss, quote_currency: USD, tick_size: 0.01, lot_size: 1}
    - {ticker: NVDA,  venue: toss, quote_currency: USD, tick_size: 0.01, lot_size: 1}
    - {ticker: GOOGL, venue: toss, quote_currency: USD, tick_size: 0.01, lot_size: 1}
    - {ticker: AMZN,  venue: toss, quote_currency: USD, tick_size: 0.01, lot_size: 1}
    - {ticker: META,  venue: toss, quote_currency: USD, tick_size: 0.01, lot_size: 1}
    - {ticker: AVGO,  venue: toss, quote_currency: USD, tick_size: 0.01, lot_size: 1}
    - {ticker: LLY,   venue: toss, quote_currency: USD, tick_size: 0.01, lot_size: 1}
  refresh_every_bars: 21
  filters:
    - {type: age, params: {min_bars: 250}}
    - {type: volatility, params: {lookback_bars: 60, min_annual_vol: 0.15, max_annual_vol: 0.9}}
    # `limit` 은 **후보 목록을 앞에서부터 자릅니다** (`LimitFilter` 는 순위가
    # 아니라 위치로 자릅니다). 4 로 두면 파일에 적힌 앞 네 종목만 남고, 뒤
    # 넷은 한 번도 후보가 되지 못합니다. 그러면 `xs_momentum` 이 "고를 것"
    # 자체가 없어집니다 — 넷 중 넷을 고르는 순위는 순위가 아니고, 게다가
    # 후보가 `min_universe` 아래면 이 알파는 **아무 인사이트도 내지 않습니다.**
    # 그 침묵은 로그에도 화면에도 안 나옵니다. 상한은 종목을 더 추가했을 때를
    # 위한 천장으로만 남깁니다. 실제 보유 종목 수는 risk.max_positions 가 셉니다.
    - {type: limit, params: {max_symbols: 8}}

alpha:
  # 순위를 사는 방식입니다 — 개별 종목을 고르는 게 아니라, 같은 후보 중
  # 지난 여섯 달 가장 많이 오른 넷만 들고 한 달에 한 번 갈아탑니다.
  # min_universe 를 명시해 둡니다. 기본값(6)은 보이지 않는 숫자인데, 필터가
  # 후보를 그 아래로 깎으면 이 알파는 조용히 발화를 멈춥니다 — 순위를 매길
  # 만한 후보가 없는데 매기는 것이 더 나쁘기 때문입니다. 숫자를 여기 적어
  # 두면 유니버스 필터를 손댈 때 같이 보입니다.
  - {type: xs_momentum, params: {lookback: 126, skip: 21, top_n: 4, rebalance_every: 21,
                                 vol_adjust: true, min_universe: 6}}
  - {type: ema_cross, params: {fast: 20, slow: 60, adx_min: 20, hold_bars: 20}}
  - {type: regime_filter, params: {period: 200, max_annual_vol: 0.9}}
  # ── AI 데스크 ────────────────────────────────────────────────────────
  # 실매매를 하는 전략은 전부 데스크를 거칩니다. 규칙 신호는 "무엇을" 만
  # 말하고 "왜" 는 말하지 못하는데, 나중에 왜 샀는지 되짚을 수 있는 자료가
  # 그것뿐이면 잘못된 매매에서 배울 것이 없습니다.
  #
  # 데스크가 꺼져도(키 없음·한도 초과·오류) 위 규칙 신호는 그대로 돕니다 —
  # LLM 이 죽었다고 엔진까지 멈추지는 않습니다.
  - type: desk
    params:
      llm:          {provider: google, model: gemini-3.7-flash, max_tokens: 1200}
      decision_llm: {provider: google, model: gemini-3.1-pro-preview, max_tokens: 1600}
      cadence_bars: 1
      # **후보 전부를 봅니다.** 2 였습니다 — 그러면 그 둘이 관망일 때 나머지
      # 종목은 그 봉에서 한 번도 검토되지 않습니다. 화면에는 "관망" 하나만
      # 남고, 사람은 봇이 멈춘 것으로 읽습니다.
      max_symbols_per_run: 4
      # **한 번에 두 종목씩** 심의합니다. 넷을 한꺼번에 던지면 같은 순간에
      # 76번이 호출되고, 무료 티어 제미나이는 그 대부분을 튕겨 냅니다 —
      # 로그에 종목당 19번이면 되는 호출이 **80번** 찍힌 이유입니다. 튕긴
      # 호출은 기다렸다 다시 나가므로 넓게 보려다 느려지고 비싸집니다.
      # 한도가 넉넉한 키를 쓰면 올리세요.
      concurrent_symbols: 2
      debate_rounds: 1
      risk_debate_rounds: 1
      # **120초였고, 그게 관망을 만들고 있었습니다.** 마감 안에 토론·결정이
      # 끝나지 않으면 데스크는 분석가 합의로 대체하고 확신을 깎습니다 —
      # 판단이 아니라 시간이 모자란 것인데, 화면에서는 둘 다 "관망" 입니다.
      # 일봉 전략에서 한 봉은 하루입니다. 4분을 못 기다릴 이유가 없습니다.
      deadline_s: 240
      min_conviction: 0.60
      cost_limit_usd: 10

portfolio:
  # 이 값은 dry_run/backtest 예행연습용 전략 장부입니다. 실거래에서는 매번
  # 토스의 현금 매수가능금액 + 보유주식 평가금액을 읽어 사이징하고, 조회에
  # 실패하면 이 값으로 대신 주문하지 않고 시작을 막습니다.
  # $1,000 × 비중 0.30 = $300 = 주문당 상한.
  starting_cash: 1000
  base_currency: USD
  model: {type: vol_target, params: {target_annual_vol: 0.18, lookback: 60}}
  max_position_weight: 0.30
  max_gross_leverage: 0.9
  cash_reserve_pct: 0.05
  allow_short: false

risk:
  models:
    - {type: max_dd_per_security, params: {atr_multiple: 8.0, max_drawdown_pct: 0.22, lock_bars: 4}}
    - {type: trailing_stop, params: {atr_multiple: 5.0, activate_at_pct: 0.08}}
    - {type: max_positions, params: {max_positions: 4}}
    - {type: max_dd_portfolio, params: {max_drawdown_pct: 0.20, halt_bars: 10}}
  protections:
    - {type: cooldown, params: {stop_bars: 2}}
    - {type: stoploss_guard, params: {lookback_bars: 60, trade_limit: 3, stop_bars: 15}}

execution:
  # 미국 대형주는 호가가 촘촘해서 한 틱이 스프레드의 전부인 경우가 많습니다.
  model: {type: limit, params: {offset_bps: 5, urgent_after_bars: 2}}
  # 하루 거래대금 한도 ÷ 하루 주문 건수 한도. 이 둘보다 최소 주문금액이 크면
  # 건수 한도는 **도달할 수 없는 숫자**가 되고(거래대금이 먼저 막습니다),
  # 신규 진입이 나갈 수 있는 잔고 구간도 그만큼 좁아집니다. 안전 천장
  # (max_order_notional·하루 한도)은 그대로 두고, 비용 통제인 이 값만
  # 두 한도에서 끌어냅니다 — 임의의 숫자가 아니라 유도된 숫자입니다.
  min_order_notional: 50        # = 500 ÷ 10

costs:
  preset: us_equity

broker:
  type: toss
  params: {client_id: "${TOSS_CLIENT_ID}", client_secret: "${TOSS_CLIENT_SECRET}",
           account_no: "${TOSS_ACCOUNT_NO}"}
  # 주문 한 건의 상한. **하루 거래대금 한도와 같은 값입니다** — 하루 예산보다
  # 큰 주문은 어차피 하루 한도에서 거절되므로, 그보다 크게 잡는 것은 의미가
  # 없고 작게 잡으면 **계좌가 자랄 때 먼저 닿는 벽** 이 됩니다.
  #
  # 예전에는 `starting_cash × 비중 × (1-예비)` 바로 위로 잡혀 있었습니다.
  # 의도는 맞지만 그 숫자는 계좌가 자라면 따라 오르지 않아서, 자산이 5%
  # 만 늘어도 신규 진입이 전부 거절됐습니다 — 그리고 그 벽에 닿는 날은
  # 계좌가 잘 되고 있는 날입니다.
  #
  # **하루 총 노출은 이 변경으로 바뀌지 않습니다.** 오늘 나갈 수 있는 주문
  # 크기는 여전히 `평가액 × 0.30 × 0.95` 이고(포트폴리오가 정합니다), 하루 총량은
  # 그대로 500 입니다. 바뀐 것은 자산이 약 1.75배가 될 때까지 이 칸이
  # 침묵한다는 것뿐입니다.
  max_order_notional: 500
  live_trading_confirmed: true

# ── 하루 거래 한도 ────────────────────────────────────────────────────────
# 전략이 고장났을 때를 가정하는 마지막 방어선입니다. 셋 중 하나만 걸려도
# 신규 진입이 멈추고, 청산은 절대 막지 않습니다.
#
# 실거래 첫 주는 작게 둡니다. "고장나면 얼마까지 잃어도 되는가" 입니다.
limits:
  max_daily_notional: 500         # 하루 총 거래대금 $500
  max_daily_orders: 10            # 하루 주문 10건
  max_daily_loss: 50              # 하루 실현손실 $50
  max_daily_loss_pct: 0.01        # 또는 자산의 1%
  # 하루의 경계는 **뉴욕 자정** 입니다. 한국시간 자정(9)을 쓰면 안 됩니다 —
  # 그 시각은 뉴욕의 10:00~11:00, 개장 30~90분 뒤입니다. 09:45 ET 에 하루
  # 손실 한도로 멈춘 봇이 몇 분 뒤 새 원장과 새 한도를 통째로 받아 다시
  # 삽니다. 한도가 "하루" 를 세는 시계와 장이 열리는 시계는 같아야 합니다.
  # -5 는 동부 표준시라 자정이 현지 00:00(겨울)/01:00(여름)이고, 어느 쪽도
  # 09:30~16:00 안에 들지 않습니다. 사용자가 "오늘" 이라 부르는 하루가 한국
  # 날짜여도, 한도가 지켜야 하는 하루는 장이 열리는 곳의 하루입니다.
  timezone_offset_hours: -5
  halt_until_next_day: true

notify:
  telegram_bot_token: "${TELEGRAM_BOT_TOKEN}"
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  # `order_rejected` 와 `state` 가 빠지면 하루 손실 한도로 멈추거나 주문이
  # 거절돼도 텔레그램이 조용합니다. 미국장은 한국시간 22:30~05:00 이라
  # 자는 동안 도는 봇이고, 그때 화면을 보고 있을 사람이 없습니다.
  on_events: [order_filled, trade_closed, protection, order_rejected, error, state]
