# AI 데스크(16석)를 제미나이로 돌리는 설정 — 한국주식 수급 + 추세.
#
#   python -m quant validate configs/kr_desk_gemini.yaml
#   python -m quant dryrun   configs/kr_desk_gemini.yaml
#
# 데스크는 시작할 때 값싼 호출 하나로 사전 점검을 합니다. 키가 잘못됐거나
# 크레딧/쿼터가 없으면 매 봉 19번씩 실패하는 대신 그 자리에서 이유를 말하고
# 비활성화됩니다.
# 🔴 **실거래입니다.** 이 설정으로 시작하면 진짜 주문이 나가고 진짜 돈이
#    움직입니다. 연습하려면 `mode: dry_run` 으로 바꾸세요 — KIS 는 모의투자
#    환경이 따로 있어서 `data.params.paper: true` 로도 연습할 수 있습니다.
name: kr-desk-gemini
label_ko: "국내 · AI 데스크 + 수급 (한투)"
description: 16석 AI 데스크 + 수급 알파. 판정 좌석만 더 큰 모델을 씁니다.
mode: live

data:
  provider: kis
  params: {app_key: "${KIS_APP_KEY}", app_secret: "${KIS_APP_SECRET}", paper: true}
  timeframe: 1d
  warmup_bars: 260
  calendar: krx

flow:
  provider: kis
  params: {app_key: "${KIS_APP_KEY}", app_secret: "${KIS_APP_SECRET}", paper: true}
  history_sessions: 120

universe:
  symbols:
    - {ticker: "005930", venue: kis, quote_currency: KRW, tick_size: 100, lot_size: 1}
    - {ticker: "000660", venue: kis, quote_currency: KRW, tick_size: 500, lot_size: 1}
    - {ticker: "035420", venue: kis, quote_currency: KRW, tick_size: 100, lot_size: 1}
  refresh_every_bars: 21

alpha:
  # 규칙 기반 알파는 데스크와 독립적으로 계속 돕니다 — LLM 이 죽어도 엔진은 삽니다.
  - {type: investor_flow, params: {window: 20, min_streak: 3, min_participation: 0.01}}
  - {type: ema_cross, params: {fast: 20, slow: 60, adx_min: 22, hold_bars: 20}}
  - {type: regime_filter, params: {period: 200, max_annual_vol: 0.8}}
  - type: desk
    params:
      llm:          {provider: google, model: gemini-3.7-flash, max_tokens: 1200}
      decision_llm: {provider: google, model: gemini-3.1-pro-preview, max_tokens: 1600}
      cadence_bars: 1
      max_symbols_per_run: 2
      debate_rounds: 1
      risk_debate_rounds: 1
      deadline_s: 120
      min_conviction: 0.6
      cost_limit_usd: 10

portfolio:
  # 실거래에서는 증권사가 알려주는 실제 잔고가 이 값을 대체합니다. 모의로
  # 예행연습할 때의 자본이기도 하니, 실제로 넣을 금액과 맞춰 두세요.
  # 100만 × 비중 0.30 = 30만 = 주문당 상한.
  starting_cash: 1000000
  base_currency: KRW
  model: {type: vol_target, params: {target_annual_vol: 0.16, lookback: 60}}
  max_position_weight: 0.30
  max_gross_leverage: 0.9
  cash_reserve_pct: 0.05

risk:
  models:
    - {type: max_dd_per_security, params: {atr_multiple: 8.0, max_drawdown_pct: 0.20}}
    - {type: trailing_stop, params: {atr_multiple: 5.0, activate_at_pct: 0.06}}
    - {type: max_positions, params: {max_positions: 3}}
    - {type: max_dd_portfolio, params: {max_drawdown_pct: 0.18, halt_bars: 10}}
  protections:
    - {type: cooldown, params: {stop_bars: 2}}
    - {type: stoploss_guard, params: {lookback_bars: 60, trade_limit: 3, stop_bars: 15}}

execution:
  model: {type: limit, params: {offset_bps: 10, urgent_after_bars: 2}}
  min_order_notional: 100000

costs: {preset: kr_equity}

broker:
  type: kis
  params: {product_code: "01"}
  max_order_notional: 300000
  live_trading_confirmed: true

# 실거래 첫 주는 작게 둡니다. "고장나면 얼마까지 잃어도 되는가" 입니다.
# 실현손실 한도가 빠져 있었습니다 — 비율만으로는 자산이 큰 계좌에서 한도가
# 사실상 없는 것과 같습니다.
limits:
  max_daily_notional: 500000      # 하루 총 거래대금 50만원
  max_daily_orders: 10            # 하루 주문 10건
  max_daily_loss: 50000           # 하루 실현손실 5만원
  max_daily_loss_pct: 0.01        # 또는 자산의 1%
  timezone_offset_hours: 9
  halt_until_next_day: true
