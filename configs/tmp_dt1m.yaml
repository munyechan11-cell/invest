# 분봉 데이트레이더: 1분봉 dry-run + 대시보드 수동개입 테스트
name: dt-1min
mode: dry_run

data:
  provider: synthetic
  params: {seed: 11, annual_drift: 0.05, annual_vol: 0.45}
  timeframe: 1m
  warmup_bars: 120
  calendar: always_open

universe:
  symbols:
    - {ticker: AAA, venue: SIM, tick_size: 0.01}
    - {ticker: BBB, venue: SIM, tick_size: 0.01}
    - {ticker: CCC, venue: SIM, tick_size: 0.01}

alpha:
  - type: ema_cross
    params: {fast: 5, slow: 20, hold_bars: 10}

portfolio:
  starting_cash: 10000000
  base_currency: KRW
  model: {type: equal_weight, params: {}}
  max_position_weight: 0.35
  max_gross_leverage: 0.9
  cash_reserve_pct: 0.02
  allow_short: false

risk:
  models:
    - {type: max_dd_per_security, params: {max_drawdown_pct: 0.01, lock_bars: 2}}
  protections: []

execution:
  model: {type: immediate}
  min_order_notional: 1000

costs:
  preset: kr_equity

broker:
  type: paper
  max_order_notional: 5000000

limits:
  max_daily_notional: 20000000
  max_daily_orders: 50
  timezone_offset_hours: 9
