# 오늘 크게 잃는 중 — 하루 손실 한도가 실제로 걸리는지 보려는 설정
name: stopme
mode: backtest

data:
  provider: synthetic
  params: {seed: 7, annual_drift: -0.60, annual_vol: 0.90}
  timeframe: 1h
  warmup_bars: 200

universe:
  symbols:
    - {ticker: AAA, venue: SIM, tick_size: 0.01}
    - {ticker: BBB, venue: SIM, tick_size: 0.01}

alpha:
  - type: rsi_reversion
    params: {period: 14, oversold: 45, require_trend: false, allow_short: false}

portfolio:
  starting_cash: 1000000
  base_currency: USD
  model: {type: equal_weight}
  max_position_weight: 0.45
  max_gross_leverage: 0.9

risk:
  models:
    - {type: max_dd_per_security, params: {atr_multiple: 1.0, max_drawdown_pct: 0.01, lock_bars: 0}}

execution:
  model: {type: immediate}
  min_order_notional: 10

costs:
  preset: us_equity

broker:
  type: paper
  max_order_notional: 500000

limits:
  max_daily_loss: 3000            # 하루 3000 잃으면 멈춰라
  timezone_offset_hours: 9

backtest:
  start: 2024-01-01T00:00:00Z
  end: 2024-03-01T00:00:00Z
  trials: 1
