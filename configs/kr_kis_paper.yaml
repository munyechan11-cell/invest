# 국내 · AI 자동매매 — 한국투자증권 **모의투자**.
#
#   python -m quant validate configs/kr_kis_paper.yaml
#
# 🟢 **돈이 움직이지 않습니다.** 그런데 백테스트도 아닙니다 — 실시간 시세를
#    받고, 진짜 주문이 한투 **모의투자 계좌** 로 나가고, 진짜 체결이 돌아옵니다.
#    실거래와 다른 것은 그 계좌의 돈이 가짜라는 것 하나뿐입니다.
#
#    과거 데이터로 돌려보는 것(`demo`)과 여기의 차이가 중요합니다. 백테스트는
#    "규칙이 과거에 무엇을 했을까" 를 답하고, 여기는 "이 봇이 지금 이 시장에서
#    실제로 무엇을 하는가" 를 답합니다. 주문이 거절되는 것, 호가단위가 안 맞는
#    것, 체결이 늦는 것 — 전부 여기서만 드러납니다.
#
# ⚠️ **키가 실계좌와 다릅니다.** 한투는 모의투자와 실계좌에 앱 키를 따로
#    발급합니다. 설정 화면의 「한국투자증권 모의투자」 카드에 넣으세요 —
#    실계좌 키를 넣으면 모의투자 호스트가 거절하고, 그때 나오는 말은
#    "키가 틀렸다" 입니다. 키는 맞고 문이 다른 것인데.
name: kr-kis-paper
label_ko: "국내 · AI 자동매매 (한투 연습계좌)"
description: 실시간 시세로 한투 모의투자 계좌에 진짜 주문을 냅니다. 돈만 가짜입니다.
mode: dry_run

data:
  provider: kis
  # ⚠️ **시세는 실계좌 키로 읽습니다 — 주문 키와 다릅니다.**
  #
  # 한투 모의투자 호스트(openapivts)는 **과거 일봉을 주지 않습니다**
  # (`inquire-daily-itemchartprice` 가 500 을 돌려줍니다). 현재가는 오는데
  # 일봉만 안 옵니다. 봇은 워밍업에 수백 봉이 필요하므로 모의투자 키만으로는
  # 시작할 수 없습니다.
  #
  # 그래서 시세만 실계좌 쪽에서 읽습니다. **같은 거래소, 같은 가격** 이고,
  # 시세 조회는 읽기 전용이라 이 키로 주문이 나가지 않습니다 — 주문은 아래
  # broker 의 모의투자 키로만 나갑니다. 설정 화면의 「한국투자증권 실계좌」
  # 카드에도 키를 넣어 주세요.
  params: {app_key: "${KIS_APP_KEY}", app_secret: "${KIS_APP_SECRET}", paper: false}
  timeframe: 1d
  warmup_bars: 260
  # **봉이 닫히기 전에도 20분마다 한 번 더 봅니다.**
  #
  # 일봉이라 한 봉은 하루입니다. 이게 0 이면 데스크가 한 바퀴(8종목) 돌고
  # 나서 다음 기회가 내일이고, 그래서 정지·재시작으로 새 사이클을 억지로
  # 돌리게 됩니다. 켜 두면 같은 봉 안에서 **아직 안 본 종목** 을 이어서
  # 훑습니다(아래 desk 의 `continue_within_bar` 와 짝입니다).
  #
  # 후보 20종목 ÷ 한 바퀴 8종목 ≈ 세 바퀴면 다 훑습니다. 20분 간격이면
  # 한 시간쯤에 한 바퀴 다 돌고, 그 뒤로는 볼 종목이 없어 조용합니다.
  review_every_minutes: 20
  calendar: krx

flow:
  provider: kis
  # 수급도 시세와 같은 창구입니다 — 위와 같은 이유로 실계좌 키입니다.
  params: {app_key: "${KIS_APP_KEY}", app_secret: "${KIS_APP_SECRET}", paper: false}
  history_sessions: 120

universe:
  # `tick_ladder: krx` — 국내 호가단위는 가격대마다 달라집니다(2만/5만/20만/50만
  # 원이 경계). 고정 `tick_size` 하나만 적어 두면 종목이 그 경계를 넘는 순간
  # 격자 밖 지정가가 되고 거래소가 거절합니다 — 진입만이 아니라 **손절도
  # 지정가로 나가므로** 그 종목은 매 봉 거절만 반복하고 포지션에 갇힙니다.
  # **후보 20종목.** 4종목이었습니다 — 그 넷이 모두 관망이면 그 봉에는
  # 아무 일도 없고, 화면에서 그건 봇이 멈춘 것과 구별되지 않습니다. 후보가
  # 넓으면 관망 하나가 곧 "오늘은 끝" 이 되지 않습니다.
  #
  # `tick_size` 는 전부 100 으로 적되 **사다리(`tick_ladder: krx`)가 실제
  # 호가단위를 정합니다** — 국내는 가격대마다 단위가 달라지고, 고정값 하나만
  # 믿으면 종목이 경계를 넘는 순간 격자 밖 지정가가 되어 거절됩니다. 진입만이
  # 아니라 **손절도 지정가로 나가므로** 그 종목은 포지션에 갇힙니다.
  #
  # 아래 목록은 후보일 뿐이고, 실제로 무엇을 사는지는 필터와 알파가 정합니다.
  # 보유 종목 수는 risk.max_positions 가 셉니다.
  symbols:
    # 삼성전자
    - {ticker: "005930", venue: kis, quote_currency: KRW, tick_size: 100, lot_size: 1, tick_ladder: krx}
    # SK하이닉스
    - {ticker: "000660", venue: kis, quote_currency: KRW, tick_size: 100, lot_size: 1, tick_ladder: krx}
    # LG에너지솔루션
    - {ticker: "373220", venue: kis, quote_currency: KRW, tick_size: 100, lot_size: 1, tick_ladder: krx}
    # 삼성바이오로직스
    - {ticker: "207940", venue: kis, quote_currency: KRW, tick_size: 100, lot_size: 1, tick_ladder: krx}
    # 현대차
    - {ticker: "005380", venue: kis, quote_currency: KRW, tick_size: 100, lot_size: 1, tick_ladder: krx}
    # 기아
    - {ticker: "000270", venue: kis, quote_currency: KRW, tick_size: 100, lot_size: 1, tick_ladder: krx}
    # 셀트리온
    - {ticker: "068270", venue: kis, quote_currency: KRW, tick_size: 100, lot_size: 1, tick_ladder: krx}
    # NAVER
    - {ticker: "035420", venue: kis, quote_currency: KRW, tick_size: 100, lot_size: 1, tick_ladder: krx}
    # 카카오
    - {ticker: "035720", venue: kis, quote_currency: KRW, tick_size: 100, lot_size: 1, tick_ladder: krx}
    # KB금융
    - {ticker: "105560", venue: kis, quote_currency: KRW, tick_size: 100, lot_size: 1, tick_ladder: krx}
    # 신한지주
    - {ticker: "055550", venue: kis, quote_currency: KRW, tick_size: 100, lot_size: 1, tick_ladder: krx}
    # 현대모비스
    - {ticker: "012330", venue: kis, quote_currency: KRW, tick_size: 100, lot_size: 1, tick_ladder: krx}
    # LG화학
    - {ticker: "051910", venue: kis, quote_currency: KRW, tick_size: 100, lot_size: 1, tick_ladder: krx}
    # 삼성SDI
    - {ticker: "006400", venue: kis, quote_currency: KRW, tick_size: 100, lot_size: 1, tick_ladder: krx}
    # 삼성물산
    - {ticker: "028260", venue: kis, quote_currency: KRW, tick_size: 100, lot_size: 1, tick_ladder: krx}
    # 한국전력
    - {ticker: "015760", venue: kis, quote_currency: KRW, tick_size: 100, lot_size: 1, tick_ladder: krx}
    # 두산에너빌리티
    - {ticker: "034020", venue: kis, quote_currency: KRW, tick_size: 100, lot_size: 1, tick_ladder: krx}
    # HD한국조선해양
    - {ticker: "009540", venue: kis, quote_currency: KRW, tick_size: 100, lot_size: 1, tick_ladder: krx}
    # HMM
    - {ticker: "011200", venue: kis, quote_currency: KRW, tick_size: 100, lot_size: 1, tick_ladder: krx}
    # 삼성생명
    - {ticker: "032830", venue: kis, quote_currency: KRW, tick_size: 100, lot_size: 1, tick_ladder: krx}
  refresh_every_bars: 21
  filters:
    - {type: age, params: {min_bars: 200}}
    - {type: volatility, params: {lookback_bars: 60, min_annual_vol: 0.12, max_annual_vol: 0.9}}
    # 후보를 몇 개까지 남길 것인가. 데스크는 이 중 max_symbols_per_run 만큼
    # 심의하고, 그 선택은 매 봉 다시 매겨집니다 — 한 종목이 관망이어도
    # 다음 봉에는 다른 종목이 올라옵니다.
    - {type: limit, params: {max_symbols: 12}}

alpha:
  - {type: investor_flow, params: {window: 20, min_streak: 3, min_participation: 0.01, hold_bars: 12}}
  - {type: ema_cross, params: {fast: 20, slow: 60, adx_min: 22, hold_bars: 20}}
  - {type: regime_filter, params: {period: 200, max_annual_vol: 0.8}}
  - type: desk
    params:
      # **토큰 예산을 줄였습니다(1200/1600 → 900/1200).** 생성 시간은 뱉는
      # 토큰 수에 거의 비례하므로, 여기가 심의 시간을 줄이는 가장 곧은 길입니다.
      #
      # 잘릴 걱정은 하지 않아도 됩니다 — 답이 중간에서 끊기면 클라이언트가
      # **예산을 최대 4배까지 늘려 다시 받아옵니다**(`Truncated`). 그래서
      # 길이가 꼭 필요한 좌석만 비용을 더 쓰고, 나머지는 전부 짧아집니다.
      # 길게 쓰는 좌석이 많아 재시도가 잦아지면 이 값을 다시 올리세요.
      llm:          {provider: google, model: gemini-3.7-flash, max_tokens: 900}
      decision_llm: {provider: google, model: gemini-3.1-pro-preview, max_tokens: 1200}
      cadence_bars: 1
      # **한 봉에 훑는 종목 수.** 4 였습니다 — 그 넷이 전부 관망이면 그 봉에는
      # 아무 일도 없고, 다음 기회는 **다음 봉** 입니다. 일봉이면 내일이고,
      # 그래서 정지·재시작으로 새 사이클을 억지로 돌리게 됩니다.
      #
      # 이 값이 곧 "한 번 돌 때 몇 종목을 보는가" 입니다. 후보 목록(위
      # `limit` 필터)까지 올리면 한 봉에 전부 훑습니다.
      #
      # ⚠️ **비용이 여기에 비례합니다.** 종목당 AI 호출이 80회쯤이므로
      # 8종목이면 한 봉에 약 640회입니다. 늘리기 전에 요금제를 보세요.
      max_symbols_per_run: 8
      # 같은 봉에서 **아직 안 본 종목만** 이어서 심의합니다. 같은 종목을
      # 두 번 보지 않으므로 회고 장부가 한 판단을 여러 건으로 세지 않습니다.
      continue_within_bar: true
      # 한 번에 **동시에** 심의할 종목 수. 나머지는 줄을 섭니다.
      #
      # 한때 2 였습니다. "429 재시도 때문에 느리다" 는 진단이었는데 **그
      # 진단이 틀렸습니다** — 로그를 세던 정규식이 한투 URL 의
      # `/quotations/` 안에 든 "quota" 를 잡고 있었고, 실제 429 는 0건이었습니다.
      # 근거가 없어졌으니 되돌립니다.
      #
      # 지금 느린 것은 쿼터가 아니라 **모델 응답 자체** 입니다. 그건 동시에
      # 돌린다고 종목 하나가 빨라지지는 않지만, 사이클 전체는 짧아집니다.
      # 한도가 빠듯한 키(무료 티어)로 바꾸면 다시 낮추세요.
      concurrent_symbols: 4
      debate_rounds: 1
      risk_debate_rounds: 1
      # **120초였고, 그게 관망을 만들고 있었습니다.** 마감 안에 토론·결정이
      # 끝나지 않으면 데스크는 분석가 합의로 대체하고 확신을 깎습니다 —
      # 화면의 "관망 · 확신 14% — 토론·결정 단계가 마감 내 완료되지 않아
      # 분석가 합의로 대체" 가 그것입니다. 판단이 아니라 **시간이 모자란
      # 것** 인데, 화면에서는 둘이 똑같이 "관망" 으로 보입니다.
      #
      # 일봉 전략이라 한 봉은 하루입니다. 4분을 기다리지 못할 이유가 없습니다.
      # 무료 티어 제미나이는 분당 요청이 제한돼 19번 호출이 줄을 섭니다.
      deadline_s: 240
      min_conviction: 0.62
      cost_limit_usd: 10

portfolio:
  # 모의투자 계좌의 예수금에 맞춰 둔 값입니다. 실제 사이징은 이 숫자가 아니라
  # **한투가 말하는 계좌 평가액** 을 읽습니다 — 예행연습이 실거래와 같은 길을
  # 지나야 예행연습입니다.
  starting_cash: 100000000        # 1억
  base_currency: KRW
  model: {type: vol_target, params: {target_annual_vol: 0.16, lookback: 60}}
  max_position_weight: 0.35
  max_gross_leverage: 0.9
  cash_reserve_pct: 0.05
  allow_short: false

risk:
  models:
    - {type: max_dd_per_security, params: {atr_multiple: 8.0, max_drawdown_pct: 0.20, lock_bars: 4}}
    - {type: trailing_stop, params: {atr_multiple: 5.0, activate_at_pct: 0.06}}
    - {type: max_positions, params: {max_positions: 3}}
    - {type: max_dd_portfolio, params: {max_drawdown_pct: 0.18, halt_bars: 10}}
  protections:
    - {type: cooldown, params: {stop_bars: 2}}
    - {type: stoploss_guard, params: {lookback_bars: 60, trade_limit: 3, stop_bars: 15}}

execution:
  model: {type: limit, params: {offset_bps: 10, urgent_after_bars: 2}}
  # 하루 거래대금 한도 ÷ 하루 주문 건수 한도. 이 둘보다 크면 건수 한도는
  # 도달할 수 없는 숫자가 되고, 진입이 나가는 잔고 구간도 그만큼 좁아집니다.
  min_order_notional: 5000000     # = 50,000,000 ÷ 10

costs:
  preset: kr_equity

broker:
  type: kis
  params:
    app_key: "${KIS_PAPER_APP_KEY}"
    app_secret: "${KIS_PAPER_APP_SECRET}"
    account_no: "${KIS_PAPER_ACCOUNT_NO}"
    product_code: "${KIS_PAPER_ACCOUNT_PRD_CD}"
    # 이 둘이 "가상 체결" 과 "모의투자 계좌에 진짜 주문" 을 가릅니다.
    # `paper_trading` 없이 두면 엔진이 혼자 체결을 흉내 내고, 그러면 주문이
    # 거절되는 것도 체결이 늦는 것도 영영 못 봅니다 — 예행연습의 요점은
    # 그것들입니다.
    paper_trading: true
    environment: paper
  # 주문 한 건의 상한. **하루 거래대금 한도와 같은 값입니다** — 하루 예산보다
  # 큰 주문은 어차피 하루 한도에서 거절되므로, 그보다 크게 잡는 것은 의미가
  # 없고 작게 잡으면 **계좌가 자랄 때 먼저 닿는 벽** 이 됩니다.
  #
  # 예전에는 `starting_cash × 비중 × (1-예비)` 바로 위로 잡혀 있었습니다.
  # 의도는 맞지만 그 숫자는 계좌가 자라면 따라 오르지 않아서, 자산이 5%
  # 만 늘어도 신규 진입이 전부 거절됐습니다 — 그리고 그 벽에 닿는 날은
  # 계좌가 잘 되고 있는 날입니다.
  #
  # **하루 총 노출은 이 변경으로 바뀌지 않습니다.** 오늘 나갈 수 있는 주문
  # 크기는 여전히 `평가액 × 0.35 × 0.95` 이고(포트폴리오가 정합니다), 하루 총량은
  # 그대로 5,000만 입니다. 바뀐 것은 자산이 약 1.5배가 될 때까지 이 칸이
  # 침묵한다는 것뿐입니다.
  max_order_notional: 50000000
  live_trading_confirmed: false

# ── 하루 거래 한도 ────────────────────────────────────────────────────────
# 모의투자에도 걸어 둡니다. 예행연습에서 한도가 없으면, 실거래로 옮기는 날
# 처음으로 한도에 걸리고 그때 그것이 정상인지 고장인지 알 수 없습니다.
limits:
  max_daily_notional: 50000000    # 하루 총 거래대금 5천만
  max_daily_orders: 10            # 하루 주문 10건
  max_daily_loss: 5000000         # 하루 실현손실 5백만
  max_daily_loss_pct: 0.01        # 또는 자산의 1%
  timezone_offset_hours: 9        # 한국시간 자정 기준
  halt_until_next_day: true

notify:
  telegram_bot_token: "${TELEGRAM_BOT_TOKEN}"
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  on_events: [order_filled, trade_closed, protection, order_rejected, error, state]
