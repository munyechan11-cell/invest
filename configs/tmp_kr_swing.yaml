# 한국 주식 — KIS 일봉. 국내 수수료·증권거래세를 반영한 비용 모델을 사용한다.
name: kr-swing-daily
description: KOSPI 대형주 추세추종 + 눌림목 매수, 변동성 타겟 사이징.
mode: backtest
data:
  provider: kis
  params: {app_key: "${KIS_APP_KEY}", app_secret: "${KIS_APP_SECRET}", paper: true}
  timeframe: 1d
  warmup_bars: 260
  calendar: krx        # 장중에만 동작, 주말·공휴일 자동 휴장
universe:
  symbols:
    - {ticker: "005930", venue: kis, quote_currency: KRW, tick_size: 100, lot_size: 1}   # 삼성전자
    - {ticker: "000660", venue: kis, quote_currency: KRW, tick_size: 500, lot_size: 1}   # SK하이닉스
alpha:
  - {type: ema_cross, params: {fast: 20, slow: 60, adx_min: 22, hold_bars: 20}}
  - {type: rsi_reversion, params: {oversold: 32, require_trend: true, allow_short: false}}
  - {type: regime_filter, params: {period: 200, max_annual_vol: 0.8}}
portfolio:
  starting_cash: 10000000        # 1천만원
  base_currency: KRW
  model: {type: vol_target, params: {target_annual_vol: 0.18, lookback: 60}}
  max_position_weight: 0.35
  max_gross_leverage: 0.9
  cash_reserve_pct: 0.05
  allow_short: false             # 국내 개인 공매도는 사실상 불가
risk:
  models:
    - {type: max_dd_per_security, params: {max_drawdown_pct: 0.10, lock_bars: 5}}
    - {type: trailing_stop, params: {atr_multiple: 3.0, activate_at_pct: 0.04}}
    - {type: max_positions, params: {max_positions: 3}}
    - {type: max_dd_portfolio, params: {max_drawdown_pct: 0.20, halt_bars: 15}}
  protections:
    - {type: cooldown, params: {stop_bars: 2}}
    - {type: stoploss_guard, params: {lookback_bars: 60, trade_limit: 4, stop_bars: 10}}
execution:
  model: {type: immediate}
  min_order_notional: 100000
costs:
  preset: kr_equity              # 수수료 + 매도 시 거래세 0.18%
broker:
  type: kis
  params: {product_code: "01"}
  max_order_notional: 3000000
  live_trading_confirmed: false
backtest:
  start: 2021-01-01T00:00:00Z
  end: 2026-01-01T00:00:00Z
