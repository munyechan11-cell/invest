name: ops-restart-test
mode: dry_run

data:
  provider: csv
  params: {directory: /tmp/opstest/csvdata}
  timeframe: 1m
  warmup_bars: 300

universe:
  symbols:
    - {ticker: AAA, venue: SIM, tick_size: 0.01}
    - {ticker: BBB, venue: SIM, tick_size: 0.01}

alpha:
  - type: ema_cross
    params: {fast: 5, slow: 20, adx_min: 0, hold_bars: 200}

portfolio:
  starting_cash: 100000
  base_currency: USD
  model: {type: equal_weight}
  max_position_weight: 0.40
  max_gross_leverage: 0.80
  allow_short: false

risk:
  models:
    - {type: max_positions, params: {max_positions: 2}}
  protections:
    - {type: cooldown, params: {stop_bars: 30}}

execution:
  model: {type: immediate}
  min_order_notional: 10

costs:
  preset: us_equity

broker:
  type: paper
  max_order_notional: 40000

limits:
  max_daily_orders: 3
  max_daily_notional: 200000
  timezone_offset_hours: 9
