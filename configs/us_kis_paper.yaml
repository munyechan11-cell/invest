# 미국 · AI 자동매매 — 한국투자증권 **모의투자**.
#
#   python -m quant validate configs/us_kis_paper.yaml
#
# 🟢 **돈이 움직이지 않습니다.** 백테스트도 아닙니다 — 실시간 시세를 받고,
#    진짜 주문이 한투 모의투자 계좌로 나가고, 진짜 체결이 돌아옵니다.
#
# **한투 키 하나로 됩니다.** 시세도 주문도 같은 키, 같은 환경입니다. 예전에는
# 한투 시세 제공자가 국내만 봐서 미국은 토스나 야후를 따로 붙여야 했고,
# 야후는 15분 지연이라 "연습에선 됐는데" 를 만드는 자리였습니다.
#
# ⚠️ **거래소 코드가 두 벌입니다.** 주문은 `NASD/NYSE/AMEX`, 시세는
#    `NAS/NYS/AMS`. 설정에는 주문 쪽 표기를 적고 시세 제공자가 알아서
#    바꿉니다. 종목이 어느 거래소인지 응답이 말해 주지 않으므로 순서대로
#    물어보고 맞은 곳을 기억합니다.
#
# ⚠️ **모의투자 환경이 해외 시세를 주는지는 첫 실행에서 확인하세요.** 한투는
#    환경마다 제공 범위가 다르고, 저장소 안에서는 확인할 수 없습니다. 안 주면
#    시작할 때 "KIS 해외 시세를 읽지 못했습니다" 로 멈춥니다 — 조용히 0 을
#    쓰지는 않습니다. 그 경우 시세만 토스로 바꾸면 됩니다(data.provider: toss).
#
# ⚠️ 미국 시장은 한국 시간 밤에 열립니다(서머타임 22:30~05:00, 그 외 23:30~06:00).
name: us-kis-paper
label_ko: "미국 · AI 자동매매 (한투 연습계좌)"
description: 실시간 시세로 한투 모의투자 계좌에 진짜 미국주식 주문을 냅니다. 돈만 가짜입니다.
mode: dry_run

data:
  provider: kis
  params:
    app_key: "${KIS_PAPER_APP_KEY}"
    app_secret: "${KIS_PAPER_APP_SECRET}"
    paper: true
    overseas_exchange: NASD
  timeframe: 1d
  warmup_bars: 300
  calendar: us_equity

universe:
  # 미국 주식은 호가단위가 가격과 무관하게 $0.01 이고 상하한가가 없습니다 —
  # 국내와 달리 `tick_ladder` 를 켜지 않습니다.
  benchmark: SPY
  symbols:
    - {ticker: AAPL,  venue: kis, quote_currency: USD, tick_size: 0.01, lot_size: 1}
    - {ticker: MSFT,  venue: kis, quote_currency: USD, tick_size: 0.01, lot_size: 1}
    - {ticker: NVDA,  venue: kis, quote_currency: USD, tick_size: 0.01, lot_size: 1}
    - {ticker: GOOGL, venue: kis, quote_currency: USD, tick_size: 0.01, lot_size: 1}
    - {ticker: AMZN,  venue: kis, quote_currency: USD, tick_size: 0.01, lot_size: 1}
    - {ticker: META,  venue: kis, quote_currency: USD, tick_size: 0.01, lot_size: 1}
    - {ticker: AVGO,  venue: kis, quote_currency: USD, tick_size: 0.01, lot_size: 1}
    - {ticker: LLY,   venue: kis, quote_currency: USD, tick_size: 0.01, lot_size: 1}
  refresh_every_bars: 21
  filters:
    - {type: age, params: {min_bars: 250}}
    - {type: volatility, params: {lookback_bars: 60, min_annual_vol: 0.15, max_annual_vol: 0.9}}
    # 후보를 `min_universe` 아래로 자르면 상대강도 알파가 조용히 발화를
    # 멈춥니다. 보유 종목 수는 risk.max_positions 가 셉니다.
    - {type: limit, params: {max_symbols: 8}}

alpha:
  - {type: xs_momentum, params: {lookback: 126, skip: 21, top_n: 4, rebalance_every: 21,
                                 vol_adjust: true, min_universe: 6}}
  - {type: ema_cross, params: {fast: 20, slow: 60, adx_min: 20, hold_bars: 20}}
  - {type: regime_filter, params: {period: 200, max_annual_vol: 0.9}}
  - type: desk
    params:
      llm:          {provider: google, model: gemini-3.7-flash, max_tokens: 1200}
      decision_llm: {provider: google, model: gemini-3.1-pro-preview, max_tokens: 1600}
      cadence_bars: 1
      max_symbols_per_run: 2
      debate_rounds: 1
      risk_debate_rounds: 1
      deadline_s: 120
      min_conviction: 0.60
      cost_limit_usd: 10

portfolio:
  # ⚠️ **이 숫자가 주문 크기를 정합니다.** 국내 설정과 다른 점입니다.
  #
  # 한투 잔고 창구가 주는 예수금은 **원화** 입니다. 달러 장부에 그 숫자를
  # 넣으면 1원 = 1달러 환산이 되므로 어댑터가 아예 넘기지 않습니다. 막는
  # 것까지는 맞는데, 그 결과 사이징 기준이 여기로 남습니다.
  #
  # 그러니 모의투자 계좌의 **외화 예수금에 맞춰 두세요.** 실제보다 크면
  # 진입이 주문당 상한에 걸려 거절되고, 작으면 최소 주문금액에 못 미쳐
  # 건너뜁니다 — 둘 다 예외 없이 조용합니다. `python -m quant validate`
  # 가 이 사실을 한 줄로 말해 줍니다.
  starting_cash: 50000
  base_currency: USD
  model: {type: vol_target, params: {target_annual_vol: 0.18, lookback: 60}}
  max_position_weight: 0.30
  max_gross_leverage: 0.9
  cash_reserve_pct: 0.05
  allow_short: false

risk:
  models:
    - {type: max_dd_per_security, params: {atr_multiple: 8.0, max_drawdown_pct: 0.22, lock_bars: 4}}
    - {type: trailing_stop, params: {atr_multiple: 5.0, activate_at_pct: 0.08}}
    - {type: max_positions, params: {max_positions: 4}}
    - {type: max_dd_portfolio, params: {max_drawdown_pct: 0.20, halt_bars: 10}}
  protections:
    - {type: cooldown, params: {stop_bars: 2}}
    - {type: stoploss_guard, params: {lookback_bars: 60, trade_limit: 3, stop_bars: 15}}

execution:
  model: {type: limit, params: {offset_bps: 5, urgent_after_bars: 2}}
  # 하루 거래대금 한도 ÷ 하루 주문 건수 한도.
  min_order_notional: 2500        # = 25,000 ÷ 10

costs:
  preset: us_equity

broker:
  type: kis
  params:
    app_key: "${KIS_PAPER_APP_KEY}"
    app_secret: "${KIS_PAPER_APP_SECRET}"
    account_no: "${KIS_PAPER_ACCOUNT_NO}"
    product_code: "${KIS_PAPER_ACCOUNT_PRD_CD}"
    overseas_exchange: NASD
    # 이 둘이 "가상 체결" 과 "모의투자 계좌에 진짜 주문" 을 가릅니다.
    paper_trading: true
    environment: paper
  max_order_notional: 15000       # 50,000 × 0.30 × 0.95 = 14,250 ≤ 15,000
  live_trading_confirmed: false

# ── 하루 거래 한도 ────────────────────────────────────────────────────────
# 모의투자에도 걸어 둡니다. 예행연습에 한도가 없으면 실거래로 옮기는 날
# 처음으로 걸리고, 그때 그것이 정상인지 고장인지 알 수 없습니다.
#
# 하루의 경계는 **뉴욕 자정** 입니다. 한국시간 자정(9)은 뉴욕 개장 30~90분
# 뒤라, 손실 한도로 멈춘 봇이 몇 분 뒤 새 한도를 받아 다시 삽니다.
limits:
  max_daily_notional: 25000
  max_daily_orders: 10
  max_daily_loss: 2500
  max_daily_loss_pct: 0.01
  timezone_offset_hours: -5
  halt_until_next_day: true

notify:
  telegram_bot_token: "${TELEGRAM_BOT_TOKEN}"
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  on_events: [order_filled, trade_closed, protection, order_rejected, error, state]
