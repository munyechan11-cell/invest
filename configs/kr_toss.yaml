# 토스증권 국내주식 — 수급 + 추세 결합, AI 데스크 옵션.
#
#   python -m quant validate configs/kr_toss.yaml
#   python -m quant dryrun   configs/kr_toss.yaml     ← 반드시 여기서 충분히 검증
#
# 🔴 **실거래입니다.** 이 설정으로 시작하면 진짜 주문이 나가고 진짜 돈이
#    움직입니다. 토스 Open API 에는 모의투자 환경이 없어서 "실계좌와 분리된
#    연습 계좌" 라는 것이 존재하지 않습니다 — 되돌릴 수 있는 것이 없습니다.
#
#    연습하려면 `mode: dry_run` 으로 바꾸세요(실시간 시세 + 가상 체결).
name: kr-toss-flow
label_ko: "국내 · AI 자동매매 (토스)"
description: 외국인·기관 수급 추종 + 추세 확인, 변동성 타겟 사이징.
mode: live

data:
  provider: toss
  params: {client_id: "${TOSS_CLIENT_ID}", client_secret: "${TOSS_CLIENT_SECRET}"}
  timeframe: 1d
  warmup_bars: 260
  calendar: krx

# 수급도 토스가 줍니다 — 이 전략은 **토스 키 하나로** 돕니다.
# 한때 여기에 "수급은 KIS 가 제공합니다 (토스는 미제공)" 이라고 적혀 있었고
# 그건 틀렸습니다. 그 한 줄 때문에 토스만 연동한 사람은 이 전략을 켜려고
# 한국투자증권 계좌를 새로 만들어야 했습니다.
#
# 다만 KIS 와 같은 자료는 아닙니다: 토스는 거래**량**(주)만 주고 금액 축이
# 없으며, `foreigner` 는 등록외국인만입니다. 그래서 한 종목의 수급을 두 소스로
# 섞어 받지 마세요 — 근거는 quant/data/providers/toss_flow.py 상단에 있습니다.
flow:
  provider: toss
  params: {client_id: "${TOSS_CLIENT_ID}", client_secret: "${TOSS_CLIENT_SECRET}"}
  history_sessions: 120

universe:
  # `tick_ladder: krx` — 국내 호가단위는 가격대마다 달라집니다(2만/5만/20만/50만
  # 원이 경계). 고정 `tick_size` 하나만 적어 두면 종목이 그 경계를 넘는 순간
  # 격자 밖 지정가가 되고 거래소가 거절합니다 — 진입만이 아니라 **손절도
  # 지정가로 나가므로** 그 종목은 매 봉 거절만 반복하고 포지션에 갇힙니다.
  # 아래 `tick_size` 는 이제 비용 추정과 유니버스 필터가 쓰는 대표값이고,
  # 주문 격자는 사다리가 가격에서 계산합니다.
  symbols:
    - {ticker: "005930", venue: toss, quote_currency: KRW, tick_size: 100, lot_size: 1, tick_ladder: krx}
    - {ticker: "000660", venue: toss, quote_currency: KRW, tick_size: 500, lot_size: 1, tick_ladder: krx}
    - {ticker: "035420", venue: toss, quote_currency: KRW, tick_size: 100, lot_size: 1, tick_ladder: krx}
    - {ticker: "005380", venue: toss, quote_currency: KRW, tick_size: 500, lot_size: 1, tick_ladder: krx}
  refresh_every_bars: 21
  filters:
    - {type: age, params: {min_bars: 200}}
    - {type: volatility, params: {lookback_bars: 60, min_annual_vol: 0.12, max_annual_vol: 0.9}}
    - {type: limit, params: {max_symbols: 3}}

alpha:
  - {type: investor_flow, params: {window: 20, min_streak: 3, min_participation: 0.01, hold_bars: 12}}
  - {type: ema_cross, params: {fast: 20, slow: 60, adx_min: 22, hold_bars: 20}}
  - {type: regime_filter, params: {period: 200, max_annual_vol: 0.8}}
  # ── AI 데스크 ────────────────────────────────────────────────────────
  # 실매매를 하는 전략은 전부 데스크를 거칩니다. 규칙 신호는 "무엇을" 만
  # 말하고 "왜" 는 말하지 못하는데, 나중에 왜 샀는지 되짚을 수 있는 자료가
  # 그것뿐이면 잘못된 매매에서 배울 것이 없습니다.
  #
  # 데스크가 꺼져도(키 없음·한도 초과·오류) 위 규칙 신호는 그대로 돕니다 —
  # LLM 이 죽었다고 엔진까지 멈추지는 않습니다.
  - type: desk
    params:
      llm:          {provider: google, model: gemini-3.7-flash, max_tokens: 1200}
      decision_llm: {provider: google, model: gemini-3.1-pro-preview, max_tokens: 1600}
      cadence_bars: 1
      # **후보 전부를 봅니다.** 2 였습니다 — 그러면 그 둘이 관망일 때 나머지
      # 종목은 그 봉에서 한 번도 검토되지 않습니다. 화면에는 "관망" 하나만
      # 남고, 사람은 봇이 멈춘 것으로 읽습니다.
      max_symbols_per_run: 4
      # **한 번에 두 종목씩** 심의합니다. 넷을 한꺼번에 던지면 같은 순간에
      # 76번이 호출되고, 무료 티어 제미나이는 그 대부분을 튕겨 냅니다 —
      # 로그에 종목당 19번이면 되는 호출이 **80번** 찍힌 이유입니다. 튕긴
      # 호출은 기다렸다 다시 나가므로 넓게 보려다 느려지고 비싸집니다.
      # 한도가 넉넉한 키를 쓰면 올리세요.
      concurrent_symbols: 2
      debate_rounds: 1
      risk_debate_rounds: 1
      # **120초였고, 그게 관망을 만들고 있었습니다.** 마감 안에 토론·결정이
      # 끝나지 않으면 데스크는 분석가 합의로 대체하고 확신을 깎습니다 —
      # 판단이 아니라 시간이 모자란 것인데, 화면에서는 둘 다 "관망" 입니다.
      # 일봉 전략에서 한 봉은 하루입니다. 4분을 못 기다릴 이유가 없습니다.
      deadline_s: 240
      min_conviction: 0.62
      cost_limit_usd: 10

portfolio:
  # 이 값은 dry_run/backtest 예행연습용 전략 장부입니다. 실거래에서는 매번
  # 토스의 현금 매수가능금액 + 보유주식 평가금액을 읽어 사이징하고, 조회에
  # 실패하면 이 값으로 대신 주문하지 않고 시작을 막습니다.
  # 80만 × 비중 0.35 = 28만 ≤ 주문당 상한 30만.
  starting_cash: 800000
  base_currency: KRW
  model: {type: vol_target, params: {target_annual_vol: 0.16, lookback: 60}}
  max_position_weight: 0.35
  max_gross_leverage: 0.9
  cash_reserve_pct: 0.05
  allow_short: false

risk:
  models:
    # 손절폭은 신호 보유기간(12~20봉)이 만드는 소음보다 넓어야 한다 — 2*sqrt(16)≈8 ATR
    - {type: max_dd_per_security, params: {atr_multiple: 8.0, max_drawdown_pct: 0.20, lock_bars: 4}}
    - {type: trailing_stop, params: {atr_multiple: 5.0, activate_at_pct: 0.06}}
    - {type: max_positions, params: {max_positions: 3}}
    - {type: max_dd_portfolio, params: {max_drawdown_pct: 0.18, halt_bars: 10}}
  protections:
    - {type: cooldown, params: {stop_bars: 2}}
    - {type: stoploss_guard, params: {lookback_bars: 60, trade_limit: 3, stop_bars: 15}}

execution:
  model: {type: limit, params: {offset_bps: 10, urgent_after_bars: 2}}
  # 하루 거래대금 한도 ÷ 하루 주문 건수 한도. 이 둘보다 최소 주문금액이 크면
  # 건수 한도는 **도달할 수 없는 숫자**가 되고(거래대금이 먼저 막습니다),
  # 신규 진입이 나갈 수 있는 잔고 구간도 그만큼 좁아집니다. 안전 천장
  # (max_order_notional·하루 한도)은 그대로 두고, 비용 통제인 이 값만
  # 두 한도에서 끌어냅니다 — 임의의 숫자가 아니라 유도된 숫자입니다.
  min_order_notional: 50000     # = 500,000 ÷ 10

costs:
  preset: kr_equity        # 수수료 + 매도 시 증권거래세

broker:
  type: toss
  params: {client_id: "${TOSS_CLIENT_ID}", client_secret: "${TOSS_CLIENT_SECRET}",
           account_no: "${TOSS_ACCOUNT_NO}"}
  # 주문 한 건의 상한. **하루 거래대금 한도와 같은 값입니다** — 하루 예산보다
  # 큰 주문은 어차피 하루 한도에서 거절되므로, 그보다 크게 잡는 것은 의미가
  # 없고 작게 잡으면 **계좌가 자랄 때 먼저 닿는 벽** 이 됩니다.
  #
  # 예전에는 `starting_cash × 비중 × (1-예비)` 바로 위로 잡혀 있었습니다.
  # 의도는 맞지만 그 숫자는 계좌가 자라면 따라 오르지 않아서, 자산이 13%
  # 만 늘어도 신규 진입이 전부 거절됐습니다 — 그리고 그 벽에 닿는 날은
  # 계좌가 잘 되고 있는 날입니다.
  #
  # **하루 총 노출은 이 변경으로 바뀌지 않습니다.** 오늘 나갈 수 있는 주문
  # 크기는 여전히 `평가액 × 0.35 × 0.95` 이고(포트폴리오가 정합니다), 하루 총량은
  # 그대로 500,000 입니다. 바뀐 것은 자산이 약 1.88배가 될 때까지 이 칸이
  # 침묵한다는 것뿐입니다.
  max_order_notional: 500000
  live_trading_confirmed: true

# ── 하루 거래 한도 ────────────────────────────────────────────────────────
# 전략이 정상일 때를 가정하는 다른 한도들과 달리, 이건 전략이 고장났을 때를
# 가정합니다. 셋 중 하나만 걸려도 신규 진입이 멈추고, 청산은 절대 막지 않습니다.
#
# 실거래 첫 주는 작게 둡니다. 이 숫자는 "잘 되면 얼마나 벌까" 가 아니라
# "고장나면 얼마까지 잃어도 되는가" 입니다.
limits:
  max_daily_notional: 500000      # 하루 총 거래대금 50만원
  max_daily_orders: 10            # 하루 주문 10건
  max_daily_loss: 50000           # 하루 실현손실 5만원
  max_daily_loss_pct: 0.01        # 또는 자산의 1%
  timezone_offset_hours: 9        # 한국시간 기준으로 자정에 초기화
  halt_until_next_day: true

notify:
  telegram_bot_token: "${TELEGRAM_BOT_TOKEN}"
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  on_events: [order_filled, trade_closed, protection, order_rejected, error, state]
