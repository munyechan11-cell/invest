name: desk-user-test
description: 16석 데스크 한 바퀴만 돌려보기
mode: dry_run

data:
  provider: yahoo
  timeframe: 1d
  warmup_bars: 260

universe:
  symbols:
    - {ticker: "005930.KS", venue: yahoo, quote_currency: KRW, tick_size: 100, lot_size: 1}

flow:
  provider: synthetic

alpha:
  - {type: investor_flow}
  - type: desk
    params:
      llm:          {provider: anthropic, model: claude-opus-5}
      decision_llm: {provider: anthropic, model: claude-opus-5}
      cadence_bars: 1
      max_symbols_per_run: 1
      debate_rounds: 1
      risk_debate_rounds: 1
      deadline_s: 600
      min_conviction: 0.6
      cost_limit_usd: 20

portfolio:
  starting_cash: 10000000
  base_currency: KRW
  model: {type: equal_weight}
  max_position_weight: 0.35

risk:
  models:
    - {type: max_positions, params: {max_positions: 3}}

execution:
  model: {type: immediate}

costs:
  preset: kr_equity

broker:
  type: paper
