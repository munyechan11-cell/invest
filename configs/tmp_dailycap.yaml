name: dailycap-test
description: 하루 손실 한도가 실제로 걸리는지 확인
mode: backtest

data:
  provider: synthetic
  params: {seed: 42, annual_drift: 0.10, annual_vol: 0.32}
  timeframe: 1d
  warmup_bars: 260

universe:
  symbols:
    - {ticker: AAA, venue: SIM, tick_size: 0.01}
    - {ticker: BBB, venue: SIM, tick_size: 0.01}
    - {ticker: CCC, venue: SIM, tick_size: 0.01}

alpha:
  - type: donchian_breakout
    params: {entry_period: 20, exit_period: 10, hold_bars: 25, allow_short: false}

portfolio:
  starting_cash: 100000
  base_currency: USD
  model: {type: vol_target, params: {target_annual_vol: 0.15, lookback: 60}}
  max_position_weight: 0.30
  max_gross_leverage: 0.95
  allow_short: false

risk:
  models:
    - {type: max_dd_per_security, params: {atr_multiple: 8.0, max_drawdown_pct: 0.25, lock_bars: 5}}

execution:
  model: {type: immediate}
  min_order_notional: 50

costs:
  preset: us_equity

broker:
  type: paper
  max_order_notional: 40000

# 내가 정한 하루 한도 — 아주 빡빡하게
limits:
  max_daily_notional: 3000
  max_daily_orders: 1
  max_daily_loss: 100
  timezone_offset_hours: 9

backtest:
  start: 2021-01-01T00:00:00Z
  end: 2021-12-31T00:00:00Z
  trials: 1
