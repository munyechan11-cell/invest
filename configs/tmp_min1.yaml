# 1분봉 데이트레이딩 dry run — 키 없이 돌리기 위해 synthetic 데이터 사용
name: min1-daytrade
description: 1분봉 스캘핑 dry run + 수동 개입 테스트
mode: dry_run

data:
  provider: synthetic
  params: {seed: 42, annual_drift: 0.10, annual_vol: 0.32}
  timeframe: 1m
  warmup_bars: 200

universe:
  symbols:
    - {ticker: AAA, venue: SIM, tick_size: 0.01}
    - {ticker: BBB, venue: SIM, tick_size: 0.01}
    - {ticker: CCC, venue: SIM, tick_size: 0.01}

alpha:
  - {type: ema_cross, params: {fast: 5, slow: 20, adx_min: 15, hold_bars: 10}}
  - {type: rsi_reversion, params: {period: 9, oversold: 30, require_trend: false, allow_short: false}}

portfolio:
  starting_cash: 100000
  base_currency: USD
  model: {type: vol_target, params: {target_annual_vol: 0.20, lookback: 60}}
  max_position_weight: 0.30
  max_gross_leverage: 0.90
  cash_reserve_pct: 0.02
  allow_short: false

risk:
  models:
    - {type: max_dd_per_security, params: {max_drawdown_pct: 0.01, lock_bars: 3}}
    - {type: trailing_stop, params: {trail_pct: 0.008, activate_at_pct: 0.002}}
    - {type: max_positions, params: {max_positions: 3}}
  protections:
    - {type: cooldown, params: {stop_bars: 1}}

execution:
  model: {type: immediate}
  min_order_notional: 10

costs:
  preset: us_equity

broker:
  type: paper
  max_order_notional: 40000

limits:
  max_daily_notional: 5000000
  max_daily_orders: 200
