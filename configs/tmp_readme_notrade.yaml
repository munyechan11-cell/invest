name: readme-no-trade
mode: backtest
data:
  provider: synthetic
  params: {seed: 3}
  timeframe: 1d
  warmup_bars: 60
universe:
  symbols:
    - {ticker: AAA, venue: SIM, tick_size: 0.01}
alpha:
  # ema_cross with a slow period longer than the whole test window: never fires.
  - {type: ema_cross, params: {fast: 900, slow: 1000}}
portfolio: {starting_cash: 100000, model: {type: vol_target}}
execution: {model: {type: immediate}}
costs: {preset: us_equity}
broker: {type: paper}
backtest:
  start: 2024-01-01T00:00:00Z
  end: 2024-06-01T00:00:00Z
