<title>팀플호에 해적이 탔다</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: projector-first 16:9 stage — header progress rail / main stage / MC control bar. Phone ballot (#ballot) is a separate one-column view. Single dark "night sea" theme by choice. */
:root{
  --ink:#061418;      /* night sea, page ground */
  --deep:#0b252b;     /* panels */
  --tide:#12363d;     /* raised panels */
  --line:#21505a;     /* hairlines */
  --foam:#eaf3ef;     /* main text */
  --mist:#93b3ad;     /* secondary text */
  --lantern:#f4b740;  /* repair, success, accent */
  --flare:#e2482f;    /* pirate, troll, failure */
  --brass:#c9965a;
  --t0:#e05a47; --t1:#4a8fe0; --t2:#e8b93c; /* the three sails */
  --display:"Black Han Sans","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--foam);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--lantern);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.15;text-wrap:balance;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}

#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr)}
#app[hidden]{display:none!important}

/* header */
.bar{display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(#0a2026,#071a1f);border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-size:20px;white-space:nowrap;color:var(--lantern)}
.brand small{font-family:var(--body);font-size:11px;color:var(--mist);margin-left:6px;letter-spacing:.08em}
.rail{flex:1;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
.rail::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 11px;font-size:13px;color:var(--mist)}
.pill.done{color:var(--foam);border-color:#2c6a72}
.pill.now{background:var(--lantern);border-color:var(--lantern);color:#1d1404;font-weight:700}
.tools{display:flex;align-items:center;gap:6px}
.clock{font-size:13px;color:var(--mist);padding:0 6px;white-space:nowrap}
.clock b{color:var(--foam);font-weight:700}
.ibtn{border:1px solid var(--line);background:var(--deep);border-radius:8px;padding:6px 10px;font-size:13px}
.ibtn[aria-pressed="true"]{background:var(--tide);border-color:var(--lantern);color:var(--lantern)}

/* stage */
#stage{position:relative;overflow:auto;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scene{max-width:1280px;margin:0 auto;display:grid;gap:18px}
.bg{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;opacity:.22;filter:saturate(.9)}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,transparent 0,var(--ink) 75%)}
.eyebrow{font-size:13px;letter-spacing:.16em;color:var(--brass);font-weight:700}
.big{font-size:clamp(34px,5vw,68px)}
.mid{font-size:clamp(24px,3vw,40px)}
.lead{font-size:clamp(17px,1.6vw,22px);color:var(--mist);max-width:62ch}
.mc{border-left:3px solid var(--brass);padding:8px 14px;background:rgba(201,150,90,.08);border-radius:0 8px 8px 0;font-size:15px;color:#e8d6bd;max-width:90ch}
.mc b{color:var(--brass);margin-right:6px;font-size:12px;letter-spacing:.1em}
.panel{background:var(--deep);border:1px solid var(--line);border-radius:14px;padding:18px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:760px){.grid3{grid-template-columns:1fr}}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.btn{border:0;border-radius:10px;padding:12px 20px;font-weight:700;background:var(--tide);border:1px solid var(--line)}
.btn.primary{background:var(--lantern);color:#1d1404;border-color:var(--lantern)}
.btn.danger{background:var(--flare);border-color:var(--flare);color:#fff}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.lg{font-size:20px;padding:16px 28px}

/* footer controls */
.ctrl{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:#071a1f;border-top:1px solid var(--line)}
.ctrl .where{flex:1;min-width:0;font-size:14px;color:var(--mist);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrl .where b{color:var(--foam)}
.timer{display:flex;align-items:center;gap:6px}
.timer .t{font-family:var(--display);font-size:28px;min-width:3.4ch;text-align:center;font-variant-numeric:tabular-nums}
.timer.warn .t{color:var(--flare);animation:blink 1s steps(2) infinite}
.timer[hidden]{display:none!important}
@keyframes blink{50%{opacity:.35}}

/* setup */
.team-card{display:grid;gap:10px;border-top:6px solid var(--tc)}
.team-card input{background:var(--ink);border:1px solid var(--line);border-radius:8px;color:var(--foam);padding:8px 10px;font-size:18px;font-weight:700;width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 16px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--lantern);color:#1d1404}
.comp{font-size:14px;color:var(--mist)}
.comp .p{color:var(--flare);font-weight:700}.comp .n{color:#7fd1c4;font-weight:700}
details.panel summary{cursor:pointer;font-weight:700}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}
.cfg label{display:grid;gap:4px;font-size:14px;color:var(--mist)}
.cfg select{background:var(--ink);color:var(--foam);border:1px solid var(--line);border-radius:8px;padding:8px}
.tl{width:100%;border-collapse:collapse;font-size:14px}
.tl td{padding:5px 8px;border-bottom:1px solid var(--line)}
.tl td:first-child{color:var(--lantern);white-space:nowrap;font-variant-numeric:tabular-nums;width:1%}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:center}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.hero img{border-radius:14px;border:1px solid var(--line);display:block;width:100%}

/* video */
.vwrap{position:relative;max-width:1200px;margin:0 auto;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#000;aspect-ratio:16/9;width:100%}
.vwrap video{width:100%;height:100%;display:block;object-fit:contain;background:#000}
.vmsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;background:rgba(6,20,24,.85)}

/* rules */
.rules{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.8fr);gap:28px;align-items:start}
@media (max-width:900px){.rules{grid-template-columns:1fr}}
.rules ol,.rules ul{margin:0;padding-left:1.2em;display:grid;gap:10px;font-size:clamp(17px,1.7vw,23px)}
.rules li b{color:var(--lantern)}
.rules .pirate{color:var(--flare)}
.wt{border-collapse:collapse;font-size:clamp(16px,1.5vw,21px);width:100%}
.wt th,.wt td{border:1px solid var(--line);padding:8px 10px;text-align:center}
.wt th{background:var(--tide);font-weight:700}
.wt td:first-child{font-weight:700}
.cardchip{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:2px 10px;font-weight:700;font-size:.9em;vertical-align:middle}
.cardchip.ok{background:var(--lantern);color:#1d1404}
.cardchip.bad{background:var(--flare);color:#fff}
.cardchip svg{width:1.1em;height:1.1em}

/* broadcast */
.bc{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr);gap:28px;align-items:center}
@media (max-width:900px){.bc{grid-template-columns:1fr}}
.cf{position:relative;border-radius:16px;overflow:hidden;border:2px solid #5a1a10;box-shadow:0 0 0 0 rgba(226,72,47,.5);aspect-ratio:637/900;max-height:62vh;margin-inline:auto}
.cf img{width:100%;height:100%;object-fit:cover;display:block}
.cf.talk{animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 38px 6px rgba(226,72,47,.55)}}
.quote{font-size:clamp(22px,2.6vw,36px);font-weight:700;line-height:1.45;border-left:4px solid var(--flare);padding-left:18px;white-space:pre-line}
.quote.nar{border-color:var(--lantern)}
.wk{display:flex;gap:10px;flex-wrap:wrap}
.wk div{border:1px solid var(--line);border-radius:10px;padding:8px 14px;background:var(--deep);border-top:4px solid var(--tc)}
.wk b{font-size:22px}

/* ships */
.fleet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:760px){.fleet{grid-template-columns:1fr}}
.ship{background:var(--deep);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:6px;position:relative;border-top:5px solid var(--tc)}
.ship h3{font-size:24px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ship h3 small{font-family:var(--body);font-size:13px;color:var(--mist)}
.ship svg.hull{width:100%;height:auto;display:block}
.ship .st{display:flex;justify-content:space-between;font-size:14px;color:var(--mist)}
.ship .st b{color:var(--foam)}
.ship.sunk{border-color:var(--flare)}
.ship.sunk .st b{color:var(--flare)}
.ship.storm::after{content:"폭풍";position:absolute;top:10px;right:12px;background:#3c4fb8;color:#fff;font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px}
.ship.hit{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.hist{display:flex;gap:6px}
.hist i{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:11px;color:var(--mist)}
.hist i.ok{background:var(--lantern);border-color:var(--lantern);color:#1d1404}
.hist i.bad{background:var(--flare);border-color:var(--flare);color:#fff}
.edit{display:none;gap:6px;justify-content:flex-end}
.editing .edit{display:flex}
.edit button{border:1px solid var(--line);background:var(--ink);border-radius:6px;padding:2px 10px}

/* input + reveal */
.inrow{display:grid;grid-template-columns:minmax(120px,.6fr) 1fr;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.inrow:last-child{border-bottom:0}
.inrow h3{font-size:24px;border-left:6px solid var(--tc);padding-left:10px}
.inrow .seg button{min-width:64px;font-size:20px}
.reveal{display:grid;gap:18px;justify-items:center;text-align:center}
.cards{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;perspective:900px}
.fc{width:clamp(90px,11vw,150px);aspect-ratio:5/7;position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.3,1.2)}
.fc.open{transform:rotateY(180deg)}
.fc>div{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;display:grid;place-items:center;border:2px solid var(--line)}
.fc .back{background:repeating-linear-gradient(45deg,#12363d 0 10px,#0e2c32 10px 20px);}
.fc .back::after{content:"팀플호";font-family:var(--display);color:var(--brass);font-size:18px}
.fc .front{transform:rotateY(180deg);gap:4px;align-content:center;font-weight:900;font-size:clamp(16px,1.6vw,22px)}
.fc .front svg{width:52%;height:auto}
.fc .front.ok{background:var(--lantern);color:#1d1404;border-color:#ffd77a}
.fc .front.bad{background:var(--flare);color:#fff;border-color:#ff8b74}
.stamp{font-family:var(--display);font-size:clamp(36px,5vw,64px);padding:4px 22px;border:5px solid;border-radius:12px;transform:rotate(-4deg);animation:pop .35s ease-out}
.stamp.ok{color:var(--lantern);border-color:var(--lantern)}
.stamp.bad{color:var(--flare);border-color:var(--flare)}
@keyframes pop{from{transform:rotate(-4deg) scale(1.8);opacity:0}}
.tname{font-family:var(--display);font-size:clamp(30px,4vw,52px);border-bottom:6px solid var(--tc);padding:0 10px}

/* countdown */
.count{font-family:var(--display);font-size:min(38vh,280px);line-height:1;color:var(--lantern);text-align:center;animation:pop .4s}
.count.go{color:var(--flare);font-size:min(20vh,150px)}

/* ending */
.verdict{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.verdict img{width:100%;display:block;max-height:46vh;object-fit:cover}
.verdict .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 22px;background:linear-gradient(transparent,rgba(6,20,24,.92) 40%)}
.rank{display:grid;gap:10px}
.rank div{display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center;background:var(--deep);border:1px solid var(--line);border-left:8px solid var(--tc);border-radius:12px;padding:10px 16px;font-size:20px}
.rank .g{font-family:var(--display);font-size:34px;color:var(--lantern);min-width:2.2ch;text-align:center}
.rank .g.f{color:var(--flare)}
.rank small{color:var(--mist);font-size:14px}

/* ballot (phone) */
#ballot{height:100%;overflow:auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#ballot[hidden]{display:none!important}
.bl{max-width:520px;margin:0 auto;display:grid;gap:14px}
.bl .btn{width:100%;font-size:18px;padding:16px}
.cover{min-height:60vh;display:grid;place-items:center;text-align:center;border:2px dashed var(--line);border-radius:16px;padding:20px;background:var(--deep)}
.rolecard{border-radius:16px;overflow:hidden;border:2px solid var(--line);background:var(--deep)}
.rolecard img{width:100%;display:block;aspect-ratio:16/10;object-fit:cover}
.rolecard .in{padding:14px 16px;display:grid;gap:8px}
.rolecard.pirate{border-color:var(--flare)}
.rolecard.pirate h2{color:var(--flare)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice button{aspect-ratio:3/4;border-radius:14px;border:0;display:grid;place-items:center;align-content:center;gap:8px;font-size:22px;font-weight:900}
.choice svg{width:50%}
.choice .ok{background:var(--lantern);color:#1d1404}
.choice .bad{background:var(--flare);color:#fff}
.bl .stamp{font-size:28px;transform:none;animation:none;justify-self:center;white-space:nowrap;padding:4px 16px}
a.btn{color:var(--foam)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tide);border:1px solid var(--lantern);border-radius:10px;padding:10px 16px;z-index:50;font-weight:700}
@media (max-width:760px){
  .bar{flex-wrap:wrap;gap:8px}
  .rail{order:3;flex-basis:100%}
  .tools{margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
  .clock{display:none}
  .ctrl{flex-wrap:wrap}
  .ctrl .where{order:-1;flex-basis:100%}
  .ctrl .btn{flex:1}
  .inrow{grid-template-columns:1fr}
  .rank div{grid-template-columns:auto 1fr auto;font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <header class="bar">
    <div class="brand">팀플호<small>X맨을 찾아라</small></div>
    <nav class="rail" id="rail" aria-label="진행 단계"></nav>
    <div class="tools">
      <span class="clock" id="clock" title="게임 경과 시간 (목표 40분)">경과 <b class="num">00:00</b> / 40:00</span>
      <button class="ibtn" id="bSound" aria-pressed="true" title="효과음·음성">소리</button>
      <button class="ibtn" id="bSea" aria-pressed="false" title="파도 배경음">파도</button>
      <button class="ibtn" id="bEdit" aria-pressed="false" title="구멍 수 직접 수정">수정</button>
      <button class="ibtn" id="bFull" title="전체 화면">전체화면</button>
    </div>
  </header>
  <main id="stage" aria-live="polite"></main>
  <footer class="ctrl">
    <button class="btn" id="bPrev">◀ 이전</button>
    <div class="where" id="where"></div>
    <div class="timer" id="timer" hidden>
      <span class="t num" id="tval">3:00</span>
      <button class="ibtn" id="tPlay">시작</button>
      <button class="ibtn" id="tAdd" title="30초 추가">+30초</button>
      <button class="ibtn" id="tReset" title="처음부터">↺</button>
    </div>
    <button class="btn primary" id="bNext">다음 ▶</button>
  </footer>
</div>
<div id="ballot" hidden></div>

<script>
(() => {
'use strict';
/* ---------- assets ---------- */
const IMG = n => `assets/img/${n}.jpg`;
const AUD = n => `assets/audio/${n}.mp3`;
const ICON = {
  anchor:'<svg viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="11" r="6"/><path d="M32 17v40M20 27h24M10 38c2 11 11 19 22 19s20-8 22-19"/><path d="M6 42l4-5 5 4M58 42l-4-5-5 4"/></g></svg>',
  skull:'<svg viewBox="0 0 64 64" aria-hidden="true"><g fill="currentColor"><path d="M32 6C19 6 10 15 10 27c0 7 3 12 8 15v7h28v-7c5-3 8-8 8-15C54 15 45 6 32 6zm-9 30a6 6 0 110-12 6 6 0 010 12zm18 0a6 6 0 110-12 6 6 0 010 12zM29 41l3-6 3 6z"/></g><g stroke="currentColor" stroke-width="5" stroke-linecap="round"><path d="M10 52l44 8M54 52l-44 8"/></g></svg>'
};

/* ---------- game data ---------- */
const TEAM_COLORS = ['var(--t0)','var(--t1)','var(--t2)'];
const ROUNDS = [
  {no:1,title:'자료조사',tag:'출처 없는 블로그를 조심하라',audio:'g_r1',voice:'villain',
   line:'크크크. 자료조사라고?\n출처 없는 블로그 하나면 충분하지.\n자, 첫 번째 구멍을 내 볼까?',
   workers:{3:2,4:2,5:2},rule:'첫 라운드라 특수 규칙은 없습니다. 첫 조장은 생일이 가장 빠른 사람.'},
  {no:2,title:'미팅',tag:'회의 시간 정하는 데만 사흘',audio:'g_r2',voice:'villain',
   line:'회의 시간 정하는 데만 사흘.\n회의록은 텅 비었고, 단톡방은 읽씹 천국이지.\n좋아, 아주 좋아.',
   workers:{3:2,4:2,5:3},rule:'이 라운드가 끝나면 해적들의 밀회가 열립니다.'},
  {no:3,title:'PPT 제작',tag:'최종_진짜최종_수정3.pptx',audio:'g_r3',voice:'villain',
   line:'발표 자료 마감 세 시간 전.\n폰트는 깨지고, 파일명은 최종_진짜최종_수정3.\n폭풍이 온다.',
   workers:{3:2,4:3,5:3},rule:'폭풍을 맞은 배는 이번 라운드에 실패하면 구멍이 2개 뚫립니다.'},
  {no:4,title:'최종 발표',tag:'발표 명단에서 한 명의 이름을 뺀다',audio:'g_r4',voice:'villain',
   line:'최종 발표다.\n교수님 앞에서 가라앉는 배만큼 아름다운 건 없지.\n이번 구멍은… 두 배다.',
   workers:{3:2,4:3,5:4},rule:'조장은 발표 명단에서 뺄 1명을 정합니다. 실패하면 구멍이 2개 뚫립니다.'}

/* ---------- rules engine ---------- */
function roundHoles(r,t){
  const v=S.rounds[r].trolls[t];
  if(v==null||v===0) return 0;
  let h=1;
  if(r===3) h*=S.cfg.r4mult;
  if(r===2 && S.cfg.storm && S.storm===t) h*=2;
  return h;
}
function isShown(r,t){ const R=S.rounds[r]; return R.shown>t || (R.shown===t && !!R.open); }
function holes(t,{onlyShown=true}={}){
  let h=0;
  for(let r=0;r<4;r++){ if(!onlyShown||isShown(r,t)) h+=roundHoles(r,t); }
  if(S.accuse[t]===true) h=Math.max(0,h-1);
  if(S.accuse[t]===false) h+=1;
  return Math.max(0,h+(S.adj[t]||0));
}
function grade(h){ return h>=S.cfg.sink?'F':(GRADES[h]||'D+'); }
function trollTotal(t){ return S.rounds.reduce((a,r,i)=>a+(isShown(i,t)?(r.trolls[t]||0):0),0); }
function workers(r,t){ return ROUNDS[r].workers[S.teams[t].size]; }
function rolesFor(size){ return {pirate:1,nav:size>=4?1:0,sailor:size-1-(size>=4?1:0)}; }
function verdict(){
  const sunk=[0,1,2].filter(t=>holes(t,{onlyShown:false})>=S.cfg.sink);
  const pirateWin = sunk.length>=2;
  const order=[0,1,2].sort((a,b)=>{
    const ha=holes(a,{onlyShown:false}),hb=holes(b,{onlyShown:false});
    if(ha!==hb) return ha-hb;
    const ca=S.accuse[a]===true?0:1,cb=S.accuse[b]===true?0:1;
    if(ca!==cb) return ca-cb;
    return trollTotal(a)-trollTotal(b);
  });
  const escaped=[0,1,2].filter(t=>S.accuse[t]===false).sort((a,b)=>holes(b,{onlyShown:false})-holes(a,{onlyShown:false}));
  return {sunk,pirateWin,order,mvpPirate:escaped[0]};
}

/* ---------- sound ---------- */
let soundOn=true, ac=null, seaNode=null, voice=null;
function ctx(){ if(!ac){ try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){ac=null;} } if(ac&&ac.state==='suspended') ac.resume(); return ac; }
function tone(freq,dur,{type='sine',gain=.18,when=0,slide=null}={}){
  const a=ctx(); if(!a||!soundOn) return;
  const t=a.currentTime+when, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(gain,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.05);
}
function noise(dur,{gain=.25,when=0,lp=900}={}){
  const a=ctx(); if(!a||!soundOn) return;
  const len=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain();
  s.buffer=buf; f.type='lowpass'; f.frequency.value=lp; g.gain.value=gain;
  s.connect(f).connect(g).connect(a.destination); s.start(a.currentTime+when);
}
const SFX={
  flip(){ noise(.12,{gain:.35,lp:2500}); },
  ok(){ [523,659,784,1047].forEach((f,i)=>tone(f,.5,{type:'triangle',gain:.16,when:i*.09})); },
  bad(){ tone(140,.9,{type:'sawtooth',gain:.2,slide:45}); noise(.9,{gain:.5,lp:420,when:.02}); },
  tick(){ tone(880,.08,{type:'square',gain:.06}); },
  horn(){ tone(196,1.1,{type:'sawtooth',gain:.14}); tone(247,1.1,{type:'sawtooth',gain:.1,when:.02}); },
  storm(){ noise(2.2,{gain:.45,lp:600}); tone(60,2,{gain:.2,slide:40}); }
};
function sea(on){
  const a=ctx(); if(!a) return;
  if(!on){ if(seaNode){ try{seaNode.stop();}catch(e){} seaNode=null; } return; }
  const len=a.sampleRate*4, buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0); let last=0;
  for(let i=0;i<len;i++){ last=(last+.02*(Math.random()*2-1))/1.02; d[i]=last*3.2; }
  const s=a.createBufferSource(); s.buffer=buf; s.loop=true;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=500;
  const g=a.createGain(); g.gain.value=.22;
  const lfo=a.createOscillator(), lg=a.createGain(); lfo.frequency.value=.12; lg.gain.value=.14; lfo.connect(lg).connect(g.gain); lfo.start();
  s.connect(f).connect(g).connect(a.destination); s.start(); seaNode=s;
}
function playVoice(name,onEnd){
  stopVoice(); if(!soundOn) return;
  voice=new Audio(AUD(name));
  const el=document.querySelector('[data-talk]'); if(el) el.classList.add('talk');
  voice.addEventListener('ended',()=>{ const e=document.querySelector('[data-talk]'); if(e) e.classList.remove('talk'); onEnd&&onEnd(); });
  voice.play().catch(()=>{ toast('음성을 재생하려면 ▶ 버튼을 한 번 눌러 주세요'); const e=document.querySelector('[data-talk]'); if(e) e.classList.remove('talk'); });
}
function stopVoice(){ if(voice){ voice.pause(); voice=null; } }

/* ---------- timer ---------- */
const T={total:0,left:0,run:false,last:0,label:''};
function setTimer(sec,label,autostart){ T.total=sec; T.left=sec; T.label=label; T.run=!!autostart; T.last=performance.now(); drawTimer(); }
function drawTimer(){
  const el=document.getElementById('timer'); el.hidden=!T.total;
  const s=Math.max(0,Math.ceil(T.left)); document.getElementById('tval').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  el.classList.toggle('warn',T.total>0&&s<=10&&s>0&&T.run);
  document.getElementById('tPlay').textContent=T.run?'일시정지':(T.left<T.total?'계속':'시작');
}
let prevSec=null;
setInterval(()=>{
  const now=performance.now();
  if(T.run){
    T.left-= (now-T.last)/1000;
    const s=Math.ceil(T.left);
    if(s!==prevSec&&s<=5&&s>0) SFX.tick();
    prevSec=s;
    if(T.left<=0){ T.left=0; T.run=false; SFX.horn(); toast(`${T.label||'시간'} 종료!`); }
    drawTimer();
  }
  T.last=now;
  if(S.startedAt){ const e=Math.floor((Date.now()-S.startedAt)/1000); const c=document.querySelector('#clock b'); c.textContent=`${String(Math.floor(e/60)).padStart(2,'0')}:${String(e%60).padStart(2,'0')}`; c.style.color=e>2400?'var(--flare)':''; }
},200);

function shipSVG(t){

  const slots=[]; const n=Math.max(sink,h);

    if(filled) slots.push(`<path d="M${n===1?100:x} 88 q-3 -10 0 -16 q3 6 0 16" fill="#7fd1e0" opacity=".85"/>`);
  }
  return `<svg class="hull" viewBox="0 0 200 135" role="img" aria-label="${tn(t)} 배, 구멍 ${h}개">
    <g transform="${sunk?'translate(0 26) rotate(14 100 90)':''}" opacity="${sunk?.75:1}">

      <path d="M24 89 H176" stroke="#8a5a32" stroke-width="2"/>
      <clipPath id="hc${t}"><path d="M18 82 H182 L162 112 H38 Z"/></clipPath>
      <rect clip-path="url(#hc${t})" x="0" y="${112-30*lvl}" width="200" height="40" fill="#1d6f86" opacity=".55"/>
      ${slots.join('')}
    </g>
    <path d="M0 118 q12 -7 25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 V135 H0Z" fill="#0f4552"/>

}

    ${mc(`조장은 작업자 ${[3,4,5].map(n=>`${n}인 조 ${R.workers[n]}명`).join(' · ')}을 지명하세요. 의심 가는 사람을 빼도 되고, 일부러 넣어서 시험해도 됩니다.${r===3?' 이번에는 발표 명단에서 뺄 1명을 정하는 라운드입니다.':''}`)}</div>`;
  if(sub===2) return `<div class="scene">${head}
    <div class="hero"><div style="display:grid;gap:16px"><h2 class="mid">작업자만 카드 1장을<br>수리함에 엎어 넣으세요</h2>
      <p style="font-size:22px;margin:0">선원은 ${chip(true)} 만 · 해적은 ${chip(true)} 또는 ${chip(false)}</p>
      <p class="lead" style="margin:0">작업자가 아닌 사람은 고개를 돌려 주세요. 안 낸 카드는 엎어서 따로 버립니다.</p></div>
      <img src="${IMG('s8_xman')}" alt="몰래 구멍을 뚫는 X맨"></div>
    ${mc('조마다 수리함을 걷거나, 조장이 수리함을 섞은 뒤 트롤 카드 수만 MC에게 알려 주세요. 휴대폰 투표함을 쓰는 조는 화면의 트롤 수를 불러 주면 됩니다.')}</div>`;
  if(sub===3){
    const all=[0,1,2].every(t=>st.trolls[t]!=null);
    return `<div class="scene">${head}<div class="panel">
      ${[0,1,2].map(t=>`<div class="inrow" ${tc(t)}><h3>${tn(t)} <small style="font-family:var(--body);font-size:14px;color:var(--mist)">작업자 ${workers(r,t)}명</small></h3>

  }

  const cur=Math.min(st.shown,3);
  if(cur>=3) return `<div class="scene">${head}<h2 class="mid" style="text-align:center">${R.no}라운드 결과</h2>${fleet()}
    ${mc(r===1?'다음은 해적들의 밀회입니다. 모두 자리에 앉아 주세요.':r===3?'이제 최후의 지목입니다.':'항해사는 지금 망원경을 쓸 수 있습니다(게임 중 1번). 조장 바통은 왼쪽으로.')}</div>`;
  const t=cur, n=workers(r,t), k=st.trolls[t]||0;
  if(!st.orders[t]||st.orders[t].length!==n) { st.orders[t]=shuffle([...Array(n-k).fill(1),...Array(k).fill(0)]); save(); }
  const ord=st.orders[t], open=!!st.open;
  return `<div class="scene">${head}<div class="reveal" ${tc(t)}>
     <div class="tname">${tn(t)}</div>
     <div class="cards" id="cards">${ord.map(v=>`<div class="fc ${open?'open':''}"><div class="back"></div><div class="front ${v?'ok':'bad'}">${v?ICON.anchor+'수리':ICON.skull+'트롤'}</div></div>`).join('')}</div>

     <div style="margin-top:6px">${fleet()}</div></div>`;

let editing=false, showInputs=false;
function render(){
  const st=STEPS[S.step];
  const stage=$('#stage');
  let html='';
  if(st.key==='setup') html=vSetup();
  else if(st.key==='intro') html=vIntro();
  else if(st.key==='rules') html=vRules(S.sub);
  else if(st.key==='roles') html=vRoles();
  else if(st.key==='round') html=vRound(st.r,S.sub);
  else if(st.key==='night') html=vNight(S.sub);
  else if(st.key==='accuse') html=vAccuse(S.sub);
  else html=vEnding(S.sub);
  stage.innerHTML=html; stage.classList.toggle('editing',editing); stage.scrollTop=0;
  $('#rail').innerHTML=STEPS.map((s,i)=>`<button class="pill ${i===S.step?'now':i<S.step?'done':''}" data-act="jump" data-i="${i}" ${i===S.step?'aria-current="step"':''}>${s.label}</button>`).join('');
  const nowPill=$('#rail .now'); if(nowPill) nowPill.scrollIntoView({block:'nearest',inline:'center'});
  const subName = st.key==='round'?ROUND_SUBS[S.sub]:st.subs>1?`${S.sub+1}/${st.subs}`:'';
  $('#where').innerHTML=`<b>${esc(st.label)}</b>${subName?' · '+esc(subName):''}`;
  $('#bPrev').disabled=S.step===0&&S.sub===0;
  $('#bNext').textContent = S.step===STEPS.length-1&&S.sub===st.subs-1?'끝':'다음 ▶';
  $('#bNext').disabled = S.step===STEPS.length-1&&S.sub===st.subs-1;
}
function enter(){ // side effects when arriving at a screen
  stopVoice();
  const st=STEPS[S.step];
  setTimer(0);
  if(st.key==='round'){
    if(S.sub===0) setTimeout(()=>playVoice(ROUNDS[st.r].audio),350);
    if(S.sub===1) setTimer(S.cfg.tDiscuss,'회의',true);
    if(S.sub===2) setTimer(S.cfg.tVote,'비밀 수리',true);
  }
  if(st.key==='night'){
    if(S.sub===0) setTimeout(()=>playVoice(NIGHT.audio),350);
    if(S.sub===2) setTimeout(()=>playVoice(NIGHT.end,()=>{ if(S.cfg.storm&&S.storm!=null&&S.storm>=0) SFX.storm(); }),300);
  }
  if(st.key==='intro'){
    const v=$('#vid');
    if(v) v.addEventListener('error',()=>{ const w=v.parentElement; if(w&&!w.querySelector('.vmsg')) w.insertAdjacentHTML('beforeend','<div class="vmsg"><div><h3 class="mid">영상 파일을 찾지 못했습니다</h3><p class="lead">assets/intro.mp4가 index.html과 같은 폴더 구조에 있는지 확인하세요. 영상 없이 진행하려면 "다음"을 누르세요.</p></div></div>'); });
  }
  if(st.key==='accuse'){
    if(S.sub===0){ setTimeout(()=>playVoice(ACCUSE.audio),350); setTimer(S.cfg.tAccuse,'지목 토론',false); }
  }
  if(st.key==='ending'&&S.sub===0){ const V=verdict(); setTimeout(()=>{ V.pirateWin?SFX.bad():SFX.ok(); playVoice((V.pirateWin?END.pirate:END.sailor).audio); },500); }
  if(st.key==='roles') setTimer(120,'역할 확인',false);
}
function go(step,sub){
  S.step=Math.max(0,Math.min(STEPS.length-1,step)); S.sub=Math.max(0,Math.min(STEPS[S.step].subs-1,sub)); save(); render(); enter();
}
function next(){
  const st=STEPS[S.step];
  // guards
  if(st.key==='round'&&S.sub===3&&![0,1,2].every(t=>S.rounds[st.r].trolls[t]!=null)){ toast('세 조의 트롤 카드 수를 모두 입력하세요'); return; }
  if(st.key==='round'&&S.sub===4&&S.rounds[st.r].shown<3){ revealStep(); return; }
  if(st.key==='night'&&S.sub===1&&S.storm==null){ toast('해적들이 가리킨 배를 고르거나 "폭풍 없음"을 누르세요'); return; }
  if(st.key==='accuse'&&S.sub===2&&S.accuse.some(v=>v==null)){ toast('세 조의 지목 결과를 모두 입력하세요'); return; }
  if(!S.startedAt) S.startedAt=Date.now();
  if(S.sub<st.subs-1) go(S.step,S.sub+1); else go(S.step+1,0);
}
function prev(){ if(S.sub>0) go(S.step,S.sub-1); else if(S.step>0) go(S.step-1,STEPS[S.step-1].subs-1); }

function stamp(r,t){
  const fail=(S.rounds[r].trolls[t]||0)>0;
  return fail?`<div class="stamp bad">수리 실패 · 구멍 +${roundHoles(r,t)}</div>`:`<div class="stamp ok">수리 성공</div>`;
}
let flipping=false;
function revealStep(){
  const st=STEPS[S.step], R=S.rounds[st.r];
  if(R.shown>=3||flipping) return;
  const t=R.shown;
  if(R.open){ R.shown++; R.open=false; save(); render(); return; }   // move on to next team
  const box=$('#cards'); if(!box) return;
  const cards=[...box.querySelectorAll('.fc')];
  const btn=$('#flipBtn');
  flipping=true; if(btn) btn.disabled=true;
  cards.forEach((c,i)=>setTimeout(()=>{ c.classList.add('open'); SFX.flip(); },350+i*650));
  setTimeout(()=>{
    const fail=(R.trolls[t]||0)>0;
    R.open=true; save();
    $('#stampBox').innerHTML=stamp(st.r,t);
    fail?SFX.bad():SFX.ok();
    const fl=document.querySelector('.fleet'); if(fl) fl.outerHTML=fleet();
    const ship=$('#ship'+t); if(ship&&fail) ship.classList.add('hit');
    if(btn){ btn.disabled=false; btn.textContent=t<2?'다음 조 공개 ▶':'라운드 결과 보기 ▶'; }
    flipping=false;
  },350+cards.length*650+250);
}

document.addEventListener('click',e=>{

  const a=b.dataset.act, t=+b.dataset.t;
  ctx();

  else if(a==='start'){ S.startedAt=Date.now(); go(1,0); }

  else if(a==='reset'){ const keep={teams:S.teams,cfg:S.cfg}; S=fresh(); S.teams=keep.teams; S.cfg=keep.cfg; T.total=0; go(0,0); toast('새 게임을 준비했습니다'); }
  else if(a==='noreset'){ render(); }
  else if(a==='size'){ S.teams[t].size=+b.dataset.n; save(); render(); }
  else if(a==='troll'){ S.rounds[STEPS[S.step].r].trolls[t]=+b.dataset.k; S.rounds[STEPS[S.step].r].orders[t]=null; save(); render(); }
  else if(a==='toreveal'){ next(); }
  else if(a==='flip'){ revealStep(); }
  else if(a==='voice'){ playVoice(b.dataset.a); }
  else if(a==='storm'){ S.storm=t; save(); go(S.step,2); }
  else if(a==='peekin'){ showInputs=!showInputs; render(); }
  else if(a==='acc'){ S.accuse[t]=b.dataset.v==='1'; save(); render(); (b.dataset.v==='1'?SFX.ok:SFX.bad)(); }
  else if(a==='adj'){ S.adj[t]=(S.adj[t]||0)+(+b.dataset.d); save(); render(); }
  else if(a==='vplay'){ const v=$('#vid'); if(v){ v.play().catch(()=>{}); } }
  else if(a==='vfull'){ const v=$('#vid'); if(v&&v.requestFullscreen) v.requestFullscreen().catch(()=>toast('전체화면을 쓸 수 없는 환경입니다')); }
  else if(a==='countdown'){
    const cd=$('#cd'); b.disabled=true; let n=3;
    const step=()=>{ if(!cd.isConnected) return; if(n>0){ cd.textContent=n; cd.className='count'; void cd.offsetWidth; cd.style.animation='none'; void cd.offsetWidth; cd.style.animation=''; SFX.tick(); n--; setTimeout(step,1000);} else { cd.textContent='지목!'; cd.className='count go'; SFX.horn(); } };
    step();
  }
});

document.addEventListener('keydown',e=>{

  else if(a==='open'){ BV.order=shuffle([...BV.votes]); BV.votes=[]; BV.view='voteOpen'; }
  else if(a==='nav'){ BV.view=(B.size>=4&&B.roles&&!B.navUsed)?'navPick':'navNo'; }
  else if(a==='peek'){ BV.peek=+b.dataset.i; B.navUsed=true; bsave(); BV.view='navShow'; }
  bRender();
});
document.addEventListener('input',e=>{ if(e.target.id==='bname'){ B.name=e.target.value.slice(0,12); bsave(); } });
function dealNew(){
  const c=rolesFor(B.size);
  B.roles=shuffle([...Array(c.pirate).fill('pirate'),...Array(c.nav).fill('nav'),...Array(c.sailor).fill('sailor')]);
  B.navUsed=false; BV.i=0; bsave();
}

/* ---------- routing ---------- */
function route(){
  const ballot=location.hash==='#ballot';
  $('#app').hidden=ballot; $('#ballot').hidden=!ballot;
  document.body.style.overflow=ballot?'auto':'hidden';
  if(ballot){ BV.view='home'; bRender(); } else { render(); }
}
window.addEventListener('hashchange',route);
route();
})();
</script>
