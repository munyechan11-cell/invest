[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-engine"
version = "1.0.0"
description = "Event-driven algorithmic trading engine: one pipeline for backtest, dry run and live"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "pydantic>=2.9,<3",
  "numpy>=1.26",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
crypto = ["ccxt>=4.4"]
optimize = ["optuna>=4.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]
all = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "ccxt>=4.4", "optuna>=4.0"]

[project.scripts]
quant = "quant.cli:main"

[tool.setuptools.packages.find]
include = ["quant*"]

[tool.setuptools.package-data]
"quant.api" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]
