<title>PROJECT X 한동 팀플</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gaegu:wght@700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: classroom whiteboard — dark top rail / whiteboard stage with sticky notes / control bar. Single light theme by choice (projector in a lit room). */
:root{
  --board:#eef1ef;   /* whiteboard ground */
  --panel:#ffffff;
  --ink:#1d2a33;     /* marker black */
  --muted:#5b6b73;
  --line:#cfd8d6;
  --blue:#2457c5;    /* marker blue, main accent */
  --red:#d93a2b;     /* troll / failure */
  --green:#1f8a5b;   /* success */
  --sticky:#ffe36e;  /* sticky note */
  --rail:#1d2a33;
  --t0:#e05a47; --t1:#4a8fe0; --t2:#e8b93c;
  --display:"Do Hyeon","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --hand:"Gaegu","Noto Sans KR",sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--board);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.15;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr)}
#app[hidden]{display:none!important}
.bar{display:flex;align-items:center;gap:12px;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--rail);color:#f3f5f4}
.brand{font-family:var(--display);font-size:22px;white-space:nowrap;letter-spacing:.02em}
.brand b{color:var(--red);font-weight:400}
.brand small{font-family:var(--body);font-size:11px;color:#a9b7bd;margin-left:6px}
.rail{flex:1;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
.rail::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;border:1px solid #3b4b55;background:transparent;border-radius:999px;padding:4px 11px;font-size:13px;color:#a9b7bd}
.pill.done{color:#f3f5f4;border-color:#5f7380}
.pill.now{background:var(--sticky);border-color:var(--sticky);color:#2b2300;font-weight:700}
.tools{display:flex;align-items:center;gap:6px}
.clock{font-size:13px;color:#a9b7bd;white-space:nowrap;padding:0 4px}
.clock b{color:#fff}
.ibtn{border:1px solid #3b4b55;background:#26353f;color:#f3f5f4;border-radius:8px;padding:6px 10px;font-size:13px}
.ibtn[aria-pressed="true"]{background:var(--sticky);color:#2b2300;border-color:var(--sticky)}
.ibtn.h2on{background:var(--red);border-color:var(--red);color:#fff}
.codebox{display:flex;gap:4px;align-items:center}
.codebox input{width:70px;border-radius:6px;border:1px solid #3b4b55;background:#fff;color:var(--ink);padding:4px 6px;font-size:14px}
#stage{position:relative;overflow:auto;padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.h2banner{background:var(--red);color:#fff;text-align:center;font-weight:700;padding:6px 12px;font-size:14px}
.scene{max-width:1280px;margin:0 auto;display:grid;gap:16px}
.eyebrow{font-size:13px;letter-spacing:.14em;color:var(--blue);font-weight:700}
.big{font-size:clamp(34px,5vw,66px)}
.mid{font-size:clamp(24px,3vw,40px)}
.lead{font-size:clamp(17px,1.6vw,21px);color:var(--muted);max-width:64ch;margin:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
@media (max-width:760px){.grid3{grid-template-columns:1fr}}
.pic{width:100%;display:block;border-radius:12px;border:1px solid var(--line);background:#dfe5e3;aspect-ratio:16/9;object-fit:cover}
.pic.missing{visibility:hidden}
.btn{border:1px solid var(--line);border-radius:10px;padding:11px 18px;font-weight:700;background:var(--panel)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.lg{font-size:20px;padding:15px 26px}
a.btn{color:var(--ink);text-decoration:none}
/* notes */
.note{display:grid;gap:4px;padding:10px 14px;border-radius:4px 12px 12px 4px;font-size:15px;max-width:92ch}
.note b{font-size:12px;letter-spacing:.1em}
.note.mc{background:#e3ecfb;border-left:4px solid var(--blue)}
.note.mc b{color:var(--blue)}
.note.h2{background:#fbe5e2;border-left:4px solid var(--red)}
.note.h2 b{color:var(--red)}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
/* sticky */
.sticky{background:var(--sticky);padding:16px 18px;border-radius:2px;box-shadow:0 6px 14px rgba(29,42,51,.14);transform:rotate(-1deg);font-family:var(--hand);font-size:clamp(20px,2vw,26px);line-height:1.35;color:#3a3000}
.sticky:nth-child(2n){transform:rotate(1deg);background:#ffd8c2}
.sticky:nth-child(3n){transform:rotate(-.5deg);background:#cdeccf}
.sticky b{font-family:var(--display);font-weight:400}
/* event card */
.ecard{background:var(--panel);border:3px solid var(--ink);border-radius:16px;padding:22px 26px;display:grid;gap:12px;box-shadow:8px 8px 0 var(--ink)}
.ecard .tag{font-family:var(--display);font-size:18px;color:var(--red)}
.ecard h2{font-size:clamp(32px,4.2vw,58px)}
.ecard p{margin:0;font-size:clamp(18px,1.8vw,24px)}
.say{font-size:clamp(18px,1.8vw,24px);font-weight:700;border-left:4px solid var(--blue);padding-left:14px;white-space:pre-line}
.say.talk{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{border-left-color:var(--red)}}
/* tables */
.tbl{border-collapse:collapse;width:100%;font-size:clamp(15px,1.4vw,19px);background:var(--panel)}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:center}
.tbl th{background:#e5eae8}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.tbl .tot{font-weight:900;font-size:1.15em}
.tbl .sec{color:var(--red);font-weight:700}
.wrapx{overflow-x:auto}
.tdot{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--tc);margin-right:6px;vertical-align:middle}
/* team cards */
.team{border-top:7px solid var(--tc)}
.team input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:18px;font-weight:700;background:#fff;color:var(--ink)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:8px 14px;font-weight:700;min-width:44px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.inrow{display:grid;grid-template-columns:minmax(120px,.5fr) 1fr;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.inrow:last-child{border-bottom:0}
.inrow h3{font-size:24px;border-left:7px solid var(--tc);padding-left:10px}
.inrow .lbl{font-size:13px;color:var(--muted);font-weight:700}
/* dispatch */
.dispatch{width:100%;max-width:760px;margin:0 auto;display:block}
.dispatch text{font-family:var(--display)}
/* timer + ctrl */
.ctrl{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-top:1px solid var(--line)}
.ctrl .where{flex:1;min-width:0;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrl .where b{color:var(--ink)}
.timer{display:flex;align-items:center;gap:6px}
.timer[hidden]{display:none!important}
.timer .lab{font-size:13px;color:var(--muted);font-weight:700}
.timer .t{font-family:var(--display);font-size:30px;min-width:3.4ch;text-align:center;font-variant-numeric:tabular-nums}
.timer.warn .t{color:var(--red);animation:blink 1s steps(2) infinite}
.timer .ibtn{background:#fff;color:var(--ink);border-color:var(--line)}
@keyframes blink{50%{opacity:.35}}
.bigtimer{font-family:var(--display);font-size:min(22vh,170px);line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.bigtimer.warn{color:var(--red)}
.presets{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.presets button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
/* reveal + ending */
.reveal{font-family:var(--display);font-size:min(16vh,130px);text-align:center;line-height:1.1;color:var(--red)}
.rank{display:grid;gap:10px}
.rank div{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:10px solid var(--tc);border-radius:12px;padding:10px 16px;font-size:20px}
.rank .s{font-family:var(--display);font-size:34px}
.badge{display:inline-block;border-radius:6px;padding:1px 8px;font-size:13px;font-weight:700;background:var(--red);color:#fff;vertical-align:middle}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:10px;padding:10px 16px;z-index:50;font-weight:700}
.editbtn{display:none}
.editing .editbtn{display:inline-block;border:1px solid var(--line);border-radius:6px;background:#fff;padding:1px 8px;margin-left:4px}
@media (max-width:760px){
  .bar{flex-wrap:wrap;gap:8px}
  .rail{order:3;flex-basis:100%}
  .tools{margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
  .clock{display:none}
  .ctrl{flex-wrap:wrap}
  .ctrl .where{order:-1;flex-basis:100%}
  .ctrl .btn{flex:1}
  .inrow{grid-template-columns:1fr}
  .ecard{box-shadow:4px 4px 0 var(--ink)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <header class="bar">
    <div class="brand">PROJECT <b>X</b><small>한동 팀플 편</small></div>
    <nav class="rail" id="rail" aria-label="진행 단계"></nav>
    <div class="tools">
      <span class="clock" id="clock">경과 <b class="num">00:00</b> / 45:00</span>
      <button class="ibtn" id="bSound" aria-pressed="true">소리</button>
      <button class="ibtn" id="bEdit" aria-pressed="false" title="점수 ±5 보정">수정</button>
      <span class="codebox" id="codebox"></span>
      <button class="ibtn" id="bH2">진행자 2</button>
      <button class="ibtn" id="bFull">전체화면</button>
    </div>
  </header>
  <main id="stage" aria-live="polite"></main>
  <footer class="ctrl">
    <button class="btn" id="bPrev">◀ 이전</button>
    <div class="where" id="where"></div>
    <div class="timer" id="timer" hidden>
      <span class="lab" id="tlab"></span>
      <span class="t num" id="tval">0:00</span>
      <button class="ibtn" id="tPlay">시작</button>
      <button class="ibtn" id="tAdd">+30초</button>
      <button class="ibtn" id="tReset">↺</button>
    </div>
    <button class="btn primary" id="bNext">다음 ▶</button>
  </footer>
</div>

<script>
(() => {
'use strict';
const IMG=n=>`assets/img/${n}.jpg`, AUD=n=>`assets/audio/${n}.mp3`;
const TC=['var(--t0)','var(--t1)','var(--t2)'];

const DISPATCH=[[1,2,0],[2,0,1],[1,2,0]]; // DISPATCH[r][t] = team that team t sends its helper to
const LINES={
  g_r1:'1라운드, 자료조사. 이벤트 카드는 팩트체크 찬스. 각 팀은 자료 한 장을 진행자에게 가져가 믿을 만한지 한 번 물어볼 수 있습니다.',

const STEPS=[
  {key:'setup',label:'준비',subs:['준비']},
  {key:'intro',label:'오프닝',subs:['영상']},

  {key:'final',label:'결말',subs:['코인 집계','트롤팀 공개','결말','최종 점수표']}
];

const KEY='projectx-handong-v1';
const fresh=()=>({
  teams:[{name:'1팀',size:5},{name:'2팀',size:5},{name:'3팀',size:5}],
  cfg:{secretMult:1,voteHit:15},
  step:0,sub:0,startedAt:null,troll:null,problems:[0,1,2],
  r1:{rel:[null,null,null]},
  r2:{cells:[null,null,null],union:null},
  r3:{items:[null,null,null],design:null},
  r4:{crit:[null,null,null],best:[null,null,null],vote:[null,null,null]},
  coins:[null,null,null],adj:[0,0,0],revealed:false
});
let S=(()=>{ try{const r=localStorage.getItem(KEY); if(r){const s=JSON.parse(r); if(s&&s.teams&&s.r4) return s;}}catch(e){} return fresh(); })();
const save=()=>{ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} };
let host2=false, editing=false, codeOpen=false;

/* ---------- scoring (RULES.md) ---------- */
const others=t=>[0,1,2].filter(o=>o!==t);
function full(r,t){ return r===0?S.r1.rel[t]===3 : r===1?S.r2.cells[t]===3 : r===2?S.r3.items[t]===5 : false; }
function pubRound(r,t){
  if(r===0){ const v=S.r1.rel[t]; return v==null?0:v*10+(v===3?10:0); }
  if(r===1){ const v=S.r2.cells[t]; let b=v===3?20:v===2?10:0; if(S.r2.union===true) b+=10; if(S.r2.union===false) b-=5; return b; }
  if(r===2){ const v=S.r3.items[t]; let b=v==null?0:v>=5?30:v===4?20:v===3?10:0; if(S.r3.design===t) b+=5; return b; }
  return (S.r4.crit[t]||0)*10+(S.r4.best[t]||0)*10;
}
function coop(r,t){ return r<3&&full(r,DISPATCH[r][t])?5:0; }
function secret(r){
  const T=S.troll; if(T==null) return 0; const o=others(T), m=S.cfg.secretMult;
  if(r===0) return m*o.reduce((a,x)=>a+(S.r1.rel[x]==null?0:(3-S.r1.rel[x])*10),0);
  if(r===1) return m*(o.reduce((a,x)=>a+(S.r2.cells[x]!=null&&S.r2.cells[x]<3?10:0),0)+(S.r2.union===false?20:0));
  if(r===2) return m*o.reduce((a,x)=>a+(S.r3.items[x]==null?0:(5-S.r3.items[x])*5),0);
  const hits=o.filter(x=>S.r4.vote[x]===T).length, all=o.every(x=>S.r4.vote[x]!=null);
  return -S.cfg.voteHit*hits+(all&&hits===0?30:0);
}
function deduce(t){ const T=S.troll; return T==null||t===T?0:(S.r4.vote[t]===T?20:0); }
const pubTotal=t=>[0,1,2,3].reduce((a,r)=>a+pubRound(r,t)+coop(r,t),0)+(S.adj[t]||0);
const secretTotal=()=>[0,1,2,3].reduce((a,r)=>a+secret(r),0);
const coinPts=t=>(S.coins[t]==null?3:S.coins[t])*5;
const finalTotal=t=>pubTotal(t)+coinPts(t)+(t===S.troll?secretTotal():deduce(t));

/* ---------- sound ---------- */
let soundOn=true, ac=null, voice=null;
function ctx(){ if(!ac){ try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(ac&&ac.state==='suspended') ac.resume(); return ac; }
function tone(f,d,{type='sine',gain=.15,when=0}={}){ const a=ctx(); if(!a||!soundOn) return; const t=a.currentTime+when,o=a.createOscillator(),g=a.createGain(); o.type=type;o.frequency.value=f; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(gain,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g).connect(a.destination); o.start(t); o.stop(t+d+.05); }
const SFX={ tick(){tone(880,.08,{type:'square',gain:.05});}, bell(){[660,880].forEach((f,i)=>tone(f,.6,{type:'triangle',when:i*.12}));}, ok(){[523,659,784,1047].forEach((f,i)=>tone(f,.45,{type:'triangle',when:i*.08}));}, bad(){tone(180,.8,{type:'sawtooth',gain:.12});tone(120,.9,{type:'sawtooth',gain:.1,when:.1});} };
function playVoice(n,onEnd){
  stopVoice(); if(!soundOn) return;
  voice=new Audio(AUD(n)); const el=document.querySelector('[data-say]'); if(el) el.classList.add('talk');
  voice.addEventListener('ended',()=>{ const e=document.querySelector('[data-say]'); if(e) e.classList.remove('talk'); onEnd&&onEnd(); });
  voice.play().catch(()=>{ const e=document.querySelector('[data-say]'); if(e) e.classList.remove('talk'); toast('음성을 재생하지 못했습니다. ▶ 버튼을 눌러 주세요'); });
}
function stopVoice(){ if(voice){ voice.pause(); voice=null; } }

/* ---------- timer ---------- */
const T={total:0,left:0,run:false,last:0,label:''}; let prevSec=null;
function setTimer(sec,label,auto){ T.total=sec;T.left=sec;T.label=label||'';T.run=!!auto;T.last=performance.now(); drawTimer(); }
function drawTimer(){
  const el=$('#timer'); el.hidden=!T.total; const s=Math.max(0,Math.ceil(T.left)), txt=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  $('#tval').textContent=txt; $('#tlab').textContent=T.label; el.classList.toggle('warn',T.run&&s<=10&&s>0);
  $('#tPlay').textContent=T.run?'일시정지':(T.left<T.total?'계속':'시작');
  const bt=document.querySelector('.bigtimer'); if(bt){ bt.textContent=txt; bt.classList.toggle('warn',s<=10&&T.total>0); }
}
setInterval(()=>{
  const now=performance.now();
  if(T.run){ T.left-=(now-T.last)/1000; const s=Math.ceil(T.left); if(s!==prevSec&&s<=5&&s>0) SFX.tick(); prevSec=s;
    if(T.left<=0){ T.left=0;T.run=false;SFX.bell();toast(`${T.label||'시간'} 종료`); } drawTimer(); }
  T.last=now;
  if(S.startedAt){ const e=Math.floor((Date.now()-S.startedAt)/1000), c=document.querySelector('#clock b'); if(c){ c.textContent=`${String(Math.floor(e/60)).padStart(2,'0')}:${String(e%60).padStart(2,'0')}`; c.style.color=e>2700?'#ff8a7a':''; } }
},200);

function notes(mc,h2){ return `<div class="notes">${mc?`<div class="note mc"><b>MC</b>${mc}</div>`:''}${h2?`<div class="note h2"><b>진행자 2</b>${h2}</div>`:''}</div>`; }

function scoreboard({final=false}={}){
  const showSecret=host2||S.revealed;
  const rows=[0,1,2].map(t=>{
    const isT=t===S.troll;
    const cells=[0,1,2,3].map(r=>`<td class="num">${pubRound(r,t)}</td>`).join('');
    const co=[0,1,2].reduce((a,r)=>a+coop(r,t),0);
    const sec=showSecret&&isT?`<td class="num sec">${secretTotal()}</td>`:(showSecret?'<td>–</td>':'');
    const extra=final?`<td class="num">${coinPts(t)}</td><td class="num">${isT?'–':deduce(t)}</td>`:'';
    const tot=final?finalTotal(t):pubTotal(t)+(showSecret&&isT?secretTotal():0);
    return `<tr><td>${dot(t)}<b>${tn(t)}</b> ${showSecret&&isT?'<span class="badge">트롤</span>':''}<button class="editbtn" data-act="adj" data-t="${t}" data-v="-5">−5</button><button class="editbtn" data-act="adj" data-t="${t}" data-v="5">+5</button></td>${cells}<td class="num">${co}</td>${extra}${sec}<td class="num tot">${tot}</td></tr>`;
  }).join('');
  return `<div class="wrapx"><table class="tbl"><thead><tr><th>팀</th><th>1R</th><th>2R</th><th>3R</th><th>4R</th><th>협력</th>${final?'<th>코인</th><th>추리</th>':''}${showSecret?'<th>비밀 트롤</th>':''}<th>합계</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ---------- render / flow ---------- */
function render(){
  const st=STEPS[S.step]; let h='';
  if(st.key==='setup') h=vSetup(); else if(st.key==='intro') h=vIntro(); else if(st.key==='rules') h=vRules(S.sub);
  else if(st.key==='draw') h=vDraw(S.sub); else if(st.key==='r') h=vRound(st.r,S.sub); else h=vFinal(S.sub);
  const stage=$('#stage'); stage.innerHTML=(host2?'<div class="h2banner">진행자 2 모드 · 비밀 정보 표시 중 — 청중에게 화면을 보여 주지 마세요</div>':'')+h; stage.classList.toggle('editing',editing);
  $('#rail').innerHTML=STEPS.map((s,i)=>`<button class="pill ${i===S.step?'now':i<S.step?'done':''}" data-act="jump" data-i="${i}">${s.label}</button>`).join('');
  const np=$('#rail .now'); if(np) np.scrollIntoView({block:'nearest',inline:'center'});
  $('#where').innerHTML=`<b>${esc(st.label)}</b> · ${esc(st.subs[S.sub])}`;
  const last=S.step===STEPS.length-1&&S.sub===st.subs.length-1;
  $('#bPrev').disabled=S.step===0&&S.sub===0; $('#bNext').disabled=last;
  $('#bH2').classList.toggle('h2on',host2); $('#bH2').textContent=host2?'진행자 2 끄기':'진행자 2';
  drawTimer();
}
function enter(){
  stopVoice(); setTimer(0); const st=STEPS[S.step], name=st.subs[S.sub];
  if(st.key==='r'){
    const R=RD[st.r];
    if(name==='이벤트 카드') setTimeout(()=>playVoice(R.audio),350);
    if(name==='지원 팀원 파견') setTimeout(()=>playVoice('g_dispatch'),350);
    if(['자료 탐색·거래','팀 회의','PPT 제작','연합 회의','추리 투표'].includes(name)){ const p=presetsNow[0]; setTimer(p.sec,p.label,true); render(); }
    if(name==='발표'){ const p=presetsNow[0]; setTimer(p.sec,p.label,false); render(); }
    if(name==='추리 투표') setTimeout(()=>playVoice('g_vote'),350);
  }
  if(st.key==='final'&&S.sub===1) setTimeout(()=>playVoice('g_reveal'),350);
  if(st.key==='final'&&S.sub===2){ const ranks=[0,1,2].sort((a,b)=>finalTotal(b)-finalTotal(a)), tw=S.troll!=null&&ranks[0]===S.troll; setTimeout(()=>{ (tw?SFX.bad:SFX.ok)(); playVoice(tw?'g_end_troll':'g_end_normal'); },400); }
}
function go(step,sub){ S.step=Math.max(0,Math.min(STEPS.length-1,step)); S.sub=Math.max(0,Math.min(STEPS[S.step].subs.length-1,sub)); save(); render(); enter(); }
function next(){
  const st=STEPS[S.step], name=st.subs[S.sub];
  if(name==='판정 입력'){ const r=st.r; const miss= r===0?S.r1.rel.some(v=>v==null): r===1?(S.r2.cells.some(v=>v==null)||S.r2.union==null): r===2?(S.r3.items.some(v=>v==null)||S.r3.design==null): (S.r4.crit.some(v=>v==null)||S.r4.best.some(v=>v==null)||S.r4.vote.some(v=>v==null));
    if(miss){ toast('판정을 모두 입력하세요'); return; } }
  if(st.key==='draw'&&S.sub===1&&S.troll==null){ toast('진행자 2가 트롤팀을 지정해야 합니다'); return; }
  if(!S.startedAt) S.startedAt=Date.now();
  if(S.sub<st.subs.length-1) go(S.step,S.sub+1); else go(S.step+1,0);
}
function prev(){ if(S.sub>0) go(S.step,S.sub-1); else if(S.step>0) go(S.step-1,STEPS[S.step-1].subs.length-1); }

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return; ctx();
  const a=b.dataset.act, t=+b.dataset.t, v=b.dataset.v!==undefined?Number(b.dataset.v):null;
  if(a==='jump') go(+b.dataset.i,0);
  else if(a==='start'){ S.startedAt=Date.now(); go(1,0); }
  else if(a==='resume') go(S.step||1,S.sub);
  else if(a==='askreset') b.outerHTML='<span class="row"><b>진행 기록을 모두 지울까요?</b><button class="btn danger" data-act="reset">지우고 새로 시작</button><button class="btn" data-act="noreset">취소</button></span>';
  else if(a==='reset'){ const k={teams:S.teams,cfg:S.cfg}; S=fresh(); S.teams=k.teams; S.cfg=k.cfg; go(0,0); toast('새 게임을 준비했습니다'); }
  else if(a==='noreset') render();
  else if(a==='size'){ S.teams[t].size=v; save(); render(); }
  else if(a==='mult'){ S.cfg.secretMult=v; save(); render(); }
  else if(a==='hit'){ S.cfg.voteHit=v; save(); render(); }
  else if(a==='prob'){ S.problems[t]=v; save(); render(); }
  else if(a==='troll'){ S.troll=t; save(); render(); toast('지정 완료'); }
  else if(a==='rel'){ S.r1.rel[t]=v; save(); render(); }
  else if(a==='cells'){ S.r2.cells[t]=v; save(); render(); }
  else if(a==='union'){ S.r2.union=v===1; save(); render(); }
  else if(a==='items'){ S.r3.items[t]=v; save(); render(); }
  else if(a==='design'){ S.r3.design=v; save(); render(); }
  else if(a==='crit'){ S.r4.crit[t]=v; save(); render(); }
  else if(a==='best'){ S.r4.best[t]=v; save(); render(); }
  else if(a==='vote'){ S.r4.vote[t]=v; save(); render(); }
  else if(a==='coins'){ S.coins[t]=v; save(); render(); }
  else if(a==='adj'){ S.adj[t]=(S.adj[t]||0)+v; save(); render(); }
  else if(a==='voice') playVoice(b.dataset.a);
  else if(a==='preset'){ const p=presetsNow[+b.dataset.i]||RD[3].works[0]; setTimer(p.sec,p.label,true); render(); }
  else if(a==='reveal'){ S.revealed=true; save(); SFX.bad(); render(); }
  else if(a==='vplay'){ const vd=$('#vid'); if(vd) vd.play().catch(()=>{}); }
  else if(a==='vfull'){ const vd=$('#vid'); if(vd&&vd.requestFullscreen) vd.requestFullscreen().catch(()=>toast('전체화면을 쓸 수 없습니다')); }
});
document.addEventListener('input',e=>{ const el=e.target; if(el.dataset.act==='tname'){ S.teams[+el.dataset.t].name=el.value.slice(0,12); save(); } if(el.id==='h2code'&&el.value==='0000'){ host2=true; codeOpen=false; $('#codebox').innerHTML=''; render(); } });
$('#bNext').addEventListener('click',()=>{ ctx(); next(); });
$('#bPrev').addEventListener('click',prev);
$('#tPlay').addEventListener('click',()=>{ ctx(); if(T.left<=0) T.left=T.total; T.run=!T.run; T.last=performance.now(); drawTimer(); });
$('#tAdd').addEventListener('click',()=>{ T.left+=30; T.total=Math.max(T.total,T.left); drawTimer(); });
$('#tReset').addEventListener('click',()=>{ T.left=T.total; T.run=false; drawTimer(); });
$('#bSound').addEventListener('click',e=>{ soundOn=!soundOn; e.currentTarget.setAttribute('aria-pressed',soundOn); if(!soundOn) stopVoice(); });
$('#bEdit').addEventListener('click',e=>{ editing=!editing; e.currentTarget.setAttribute('aria-pressed',editing); $('#stage').classList.toggle('editing',editing); });
$('#bH2').addEventListener('click',()=>{
  if(host2){ host2=false; render(); return; }
  codeOpen=!codeOpen; $('#codebox').innerHTML=codeOpen?'<input id="h2code" inputmode="numeric" maxlength="4" placeholder="코드" aria-label="진행자 2 코드">':'';
  if(codeOpen) $('#h2code').focus();
});
$('#bFull').addEventListener('click',()=>{ const d=document.documentElement; if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); else if(d.requestFullscreen) d.requestFullscreen().catch(()=>toast('전체화면을 쓸 수 없습니다')); });
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,select,textarea')) return;
  if(e.key===' '&&e.target.closest('button')) return;
  if(['ArrowRight','PageDown',' '].includes(e.key)){ e.preventDefault(); ctx(); next(); }
  else if(['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); prev(); }
  else if(e.key==='t'||e.key==='T') $('#tPlay').click();
});
render();
const st0=STEPS[S.step]; if(st0.key==='r'){ /* restore presets for timer buttons after reload */ vRound(st0.r,S.sub); }
})();
</script>
