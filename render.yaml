# Render blueprint — 단일 서비스.
#
# 대시보드와 트레이더를 **한 서비스**에 둡니다. 갈라놓고 싶은 유혹이 있지만
# Render 디스크는 서비스 하나에만 붙습니다. 워커를 따로 두면 워커가 쓰는
# 상태 DB 를 대시보드가 볼 수 없어서, 화면에는 "실행 중 아님"이 뜨는데
# 실제로는 봇이 주문을 내고 있는 상태가 됩니다. 그건 자동매매에서
# 가장 위험한 종류의 불일치입니다.
#
# 트레이더는 API 가 같은 프로세스 안에서 띄웁니다: POST /api/trader/start.
# 그래서 상태·현금·잠금이 전부 같은 DB 한 곳에 있습니다.
#
# **증권사 키는 여기에 넣지 않습니다.** 배포한 뒤 대시보드의 온보딩 화면과
# 마이페이지에서 입력합니다. 여기 있는 것은 앱이 뜨기 위해 그 전에 존재해야
# 하는 값들뿐입니다.
#
# 실매매로 올리는 것은 배포가 아니라 사람이 하는 별도의 결정입니다.
# 설정에서 mode 와 broker.live_trading_confirmed 를 직접 바꿔야 합니다.
# 배포 파이프라인이 오타 하나로 실제 돈을 굴리게 두지 않습니다.
services:
  - type: web
    name: quant-desk
    runtime: python
    # free 플랜은 쓰지 마세요. 유휴 시 슬립되는데, 자동매매 봇이 자다가
    # 깨면 그 사이 장이 움직인 걸 못 봅니다.
    plan: starter
    region: singapore          # KRX·아시아 거래소에 가장 가까운 리전
    healthCheckPath: /api/health
    buildCommand: pip install -r requirements.txt
    startCommand: python -m quant serve configs/demo.yaml --host 0.0.0.0 --port $PORT --state $DB_PATH
    disk:
      name: quant-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - {key: PYTHON_VERSION, value: 3.13.0}
      - {key: LOG_FORMAT, value: json}

      # 디스크 위에 두어야 하는 두 가지. Render 의 작업 디렉터리는 배포할
      # 때마다 새로 만들어지므로, 여기 아닌 곳에 쓰면 마이페이지에서 입력한
      # 증권사 키와 그동안의 포지션이 재배포마다 조용히 사라집니다.
      - {key: DB_PATH, value: /var/data/quant_state.db}
      - {key: QUANT_ENV_FILE, value: /var/data/.env}

      # 이 값으로 모든 사용자의 증권사 키를 암호화합니다. 없으면 서버가 뜨지
      # 않습니다 — 남의 키를 평문으로 받아두는 상태로 뜨느니 안 뜨는 편이 낫습니다.
      #
      # ⚠️ 잃어버리면 저장된 자격증명을 되살릴 수 없고, 전원이 다시 등록해야
      # 합니다. Render 밖에도 따로 보관하세요.
      - {key: QUANT_SECRET_KEY, generateValue: true}

      # 이것도 시작 시점에 CORS 미들웨어로 들어가므로 여기서만 설정됩니다.
      # 배포 후 받은 실제 주소를 넣으세요. 비어 있으면 교차출처를 전부 막습니다
      # (대시보드는 같은 출처에서 서빙되므로 그대로 동작합니다).
      - {key: CORS_ORIGINS, sync: false}

      # AI 데스크 비용은 서비스 운영자가 냅니다 — 가입한 사람은 자기 Gemini 키
      # 없이도 바로 써볼 수 있습니다. 사용량은 사용자별로 계량되고 요금제 상한이
      # 걸리며(quant/webapp/usage.py), 상한에 닿아도 규칙 기반 전략은 계속 돕니다.
      # 자기 키를 넣은 사용자는 상한을 받지 않고 운영자 비용에도 잡히지 않습니다.
      - {key: GOOGLE_API_KEY, sync: false}

      # ── 나머지는 전부 사용자가 사이트에서 ──────────────────────────
      # 증권사·거래소 키, 하루 거래 한도, 투자 성향은 각자 가입 후 화면에서
      # 입력합니다. 사용자별로 암호화되어 계정 DB 에 저장되며, 다시 조회할 수
      # 없습니다. 여기에 중복으로 넣으면 어느 쪽이 실제 값인지 알 수 없게 됩니다.
