<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>◆ QUANT TRADING FLOOR ◆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Pixel Hangul is optional: drop a woff2 into static/fonts/ and it is picked up.
   Missing files fail silently, so the stack just falls through. */
@font-face{font-family:"PixelKR";src:url("/static/fonts/galmuri11.woff2") format("woff2");font-display:swap}
@font-face{font-family:"PixelKR2";src:url("/static/fonts/neodgm.woff2") format("woff2");font-display:swap}

:root{
  --bg:#07080c; --panel:#0e1119; --plate:#151a25; --line:#252c3a;
  --gold:#f0c040; --gold-dim:#8a6f27; --red:#e0453c; --up:#57d977; --down:#ff5a52;
  --ink:#e8ecf2; --muted:#7b8494; --white:#fff;
  --wood:#8a6a45; --wood-dark:#6d5236; --turf:#2f6b4a; --turf-dark:#255840;
  --px:"Silkscreen","PixelKR","PixelKR2",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --kr:"PixelKR","PixelKR2","Silkscreen","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--kr);font-size:14px;line-height:1.5;
     image-rendering:pixelated;-webkit-font-smoothing:none;overflow-x:hidden}
svg,canvas{image-rendering:pixelated;shape-rendering:crispEdges}
.px{font-family:var(--px);letter-spacing:.04em}

/* ── frame ───────────────────────────────────────────────────────────── */
.wrap{max-width:1180px;margin:0 auto;padding:0 12px 96px}

header.top{position:sticky;top:0;z-index:40;background:var(--bg);
  border-bottom:3px solid var(--red);padding:10px 12px 8px}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--px);color:var(--gold);font-size:17px;font-weight:700;
  text-shadow:2px 2px 0 #000;white-space:nowrap}
.brand i{font-style:normal;color:var(--gold-dim)}
.mode{font-family:var(--px);font-size:10px;padding:3px 8px;border:2px solid var(--red);
  color:var(--red);text-transform:uppercase}
.mode.dry{border-color:var(--gold);color:var(--gold)}
.mode.backtest{border-color:var(--muted);color:var(--muted)}
.grow{flex:1}
.tab{font-family:var(--px);font-size:11px;background:var(--plate);border:2px solid var(--line);
  border-bottom:none;padding:5px 12px;color:var(--muted)}
.tab.on{color:var(--gold);border-color:var(--gold-dim)}
.conn{width:9px;height:9px;background:var(--muted);flex:0 0 auto}
.conn.on{background:var(--up);box-shadow:0 0 0 3px rgba(87,217,119,.18)}
.conn.off{background:var(--red)}

/* ── panels ──────────────────────────────────────────────────────────── */
.panel{background:var(--panel);border:2px solid var(--line);margin-top:12px}
.plate{display:inline-flex;align-items:center;gap:6px;background:var(--plate);
  border:2px solid var(--gold-dim);color:var(--gold);font-family:var(--px);font-size:11px;
  padding:4px 10px;margin:-2px 0 0 -2px}
.plate .d{color:var(--gold-dim)}
.body{padding:12px}

/* ── HUD ─────────────────────────────────────────────────────────────── */
.hud{display:grid;grid-template-columns:minmax(260px,1fr) minmax(280px,1.4fr);gap:0}
@media(max-width:760px){.hud{grid-template-columns:1fr}}
.hud-l{padding:14px 16px;border-right:2px solid var(--line)}
@media(max-width:760px){.hud-l{border-right:none;border-bottom:2px solid var(--line)}}
.sym{font-family:var(--px);font-size:13px;color:var(--muted);letter-spacing:.1em}
.big{font-family:var(--px);font-size:34px;color:var(--white);text-shadow:2px 2px 0 #000;
  margin:4px 0 2px;word-break:break-all}
@media(max-width:520px){.big{font-size:26px}}
.chg{font-family:var(--px);font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:10px;margin-top:14px}
.kpi .k{font-family:var(--px);font-size:9px;color:var(--muted);letter-spacing:.08em}
.kpi .v{font-family:var(--px);font-size:15px;margin-top:2px}
.hud-r{padding:10px 12px;min-height:150px}
#equity{width:100%;height:150px;display:block}

/* ── tables ──────────────────────────────────────────────────────────── */
table{width:100%;border-collapse:collapse;font-family:var(--px);font-size:11px}
th{color:var(--muted);text-align:left;font-weight:400;padding:5px 8px;
  border-bottom:2px solid var(--line);letter-spacing:.06em}
td{padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
.num{text-align:right}
.up{color:var(--up)} .down{color:var(--down)} .gold{color:var(--gold)}
.dim{color:var(--muted)}
.scroll{overflow:auto;max-height:260px}

/* ── the floor ───────────────────────────────────────────────────────── */
.room{position:relative;padding:30px 10px 12px;overflow:hidden}
.room.wood{background:
  repeating-linear-gradient(90deg,var(--wood) 0 46px,var(--wood-dark) 46px 48px),
  repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 22px,rgba(0,0,0,0) 22px 24px)}
.room.turf{background:
  repeating-linear-gradient(90deg,var(--turf) 0 30px,var(--turf-dark) 30px 32px),
  repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 30px,rgba(0,0,0,0) 30px 32px)}
.room .plate{position:absolute;top:0;left:0;margin:0}
.round{position:absolute;top:0;right:0;font-family:var(--px);font-size:10px;
  background:var(--plate);border:2px solid var(--line);border-top:none;border-right:none;
  padding:4px 10px;color:var(--gold)}

.seats{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:flex-end}
.seat{width:132px;display:flex;flex-direction:column;align-items:center;position:relative;
  padding-top:84px}
@media(max-width:520px){.seat{width:104px;padding-top:88px}}
.seat .seatname{font-family:var(--px);font-size:11px;color:#2a1d0e;text-shadow:1px 1px 0 rgba(255,255,255,.28)}
.seat .role{font-family:var(--px);font-size:9px;background:#efe6d2;border:2px solid #2a1d0e;
  color:#2a1d0e;padding:1px 5px;margin-top:3px;white-space:nowrap}
.seat.idle{opacity:.55;filter:grayscale(.8)}
.seat.active .avatar{animation:bob .55s steps(2) infinite}
@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-3px)}100%{transform:translateY(0)}}
.avatar{width:56px;height:64px}
.desk{width:88px;height:12px;background:#7a5a38;border:2px solid #2a1d0e;margin-top:-4px}

/* speech bubble */
.bubble{position:absolute;bottom:calc(100% - 80px);left:50%;transform:translateX(-50%);
  width:186px;background:#fdfbf3;border:2px solid #2a1d0e;color:#171310;
  font-size:11px;line-height:1.45;padding:6px 8px;z-index:5;
  box-shadow:3px 3px 0 rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .12s}
.seat.talking .bubble{opacity:1}
.bubble:after{content:"";position:absolute;top:100%;left:50%;margin-left:-5px;
  width:0;height:0;border:5px solid transparent;border-top-color:#2a1d0e}
.bubble b{display:block;font-family:var(--px);font-size:9px;margin-bottom:3px}
.bubble.bull b{color:#0a7a3c} .bubble.bear b{color:#a11c17} .bubble.neutral b{color:#5a5a5a}

/* debate room */
.duel{display:flex;align-items:flex-end;justify-content:center;gap:18px;flex-wrap:wrap}
.vs{font-family:var(--px);font-size:20px;color:#ffe9a8;text-shadow:2px 2px 0 #143a26;
  align-self:center;padding-bottom:36px}

/* decision banner */
.verdict{margin-top:12px;border:3px solid var(--gold);background:#12101a;padding:12px 14px;
  display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.verdict.hidden{display:none}
.verdict .act{font-family:var(--px);font-size:22px;padding:6px 14px;border:3px solid currentColor}
.verdict .meta{font-family:var(--px);font-size:11px;color:var(--muted);line-height:1.9}
.verdict .why{flex:1;min-width:220px;font-size:12px;color:var(--ink)}
.verdict .why em{display:block;color:var(--gold);font-style:normal;font-family:var(--px);
  font-size:9px;margin-bottom:3px}

/* flow bars */
.flowrow{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;
  padding:6px 0;border-bottom:1px solid var(--line)}
.flowrow:last-child{border-bottom:0}
.flowsym{font-family:var(--px);font-size:11px}
.bars{display:flex;gap:3px;align-items:center;height:22px}
.bars .b{flex:1;height:100%;position:relative;background:#12161f;border:1px solid var(--line)}
.bars .b i{position:absolute;left:0;right:0;bottom:0;display:block}
.bars .lbl{font-family:var(--px);font-size:8px;color:var(--muted);width:30px;text-align:right}

/* event feed */
.feed{font-family:var(--px);font-size:10px;max-height:250px;overflow:auto}
.feed div{display:flex;gap:8px;padding:3px 0;border-bottom:1px solid var(--line)}
.feed .t{color:var(--muted);flex:0 0 54px}
.feed .ty{flex:0 0 118px}
.feed .m{color:#aeb6c4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ticker tape */
.tape{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#000;
  border-top:3px solid var(--gold-dim);overflow:hidden;height:34px}
.tape-in{display:inline-flex;gap:34px;white-space:nowrap;padding:9px 0;
  font-family:var(--px);font-size:11px;animation:tape 42s linear infinite}
@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tape b{color:var(--gold);font-weight:400;margin-right:6px}

.btn{font-family:var(--px);font-size:10px;background:var(--plate);border:2px solid var(--gold-dim);
  color:var(--gold);padding:5px 10px;cursor:pointer}
.btn:hover{background:#1c2231}
.demo-tag{font-family:var(--px);font-size:9px;color:#000;background:var(--gold);padding:2px 6px}
.empty{font-family:var(--px);font-size:10px;color:var(--muted);text-align:center;padding:18px}
footer{max-width:1180px;margin:0 auto;padding:14px 12px;color:var(--muted);font-size:11px}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <span class="conn" id="conn"></span>
    <span class="brand"><i>◆</i> QUANT TRADING FLOOR <i>◆</i></span>
    <span class="mode backtest px" id="mode">OFFLINE</span>
    <span class="grow"></span>
    <button class="btn" id="demoBtn">▶ 데모 재생</button>
    <span class="tab on px" id="strategy">—</span>
  </div>
</header>

<div class="wrap">

  <!-- HUD -->
  <section class="panel">
    <span class="plate"><span class="d">◆</span> 계좌 <span class="d">◆</span></span>
    <div class="hud">
      <div class="hud-l">
        <div class="sym" id="hudSym">PORTFOLIO</div>
        <div class="big" id="hudEquity">—</div>
        <div class="chg" id="hudChange">—</div>
        <div class="kpis" id="hudKpis"></div>
      </div>
      <div class="hud-r"><canvas id="equity"></canvas></div>
    </div>
  </section>

  <!-- positions -->
  <section class="panel">
    <span class="plate"><span class="d">◆</span> 보유 종목 <span class="d">◆</span></span>
    <div class="body scroll"><table id="positions"><tbody></tbody></table></div>
  </section>

  <!-- analyst room -->
  <section class="panel">
    <div class="room wood">
      <span class="plate"><span class="d">◆</span> 애널리스트 데스크 <span class="d">◆</span></span>
      <span class="round px" id="deskSubject">대기 중</span>
      <div class="seats" id="analystSeats"></div>
    </div>
  </section>

  <!-- debate room -->
  <section class="panel">
    <div class="room turf">
      <span class="plate"><span class="d">◆</span> 토론장 <span class="d">◆</span></span>
      <span class="round px" id="roundTag">ROUND —</span>
      <div class="duel" id="debateSeats"></div>
    </div>
  </section>

  <!-- risk committee -->
  <section class="panel">
    <div class="room turf">
      <span class="plate"><span class="d">◆</span> 리스크 위원회 <span class="d">◆</span></span>
      <span class="round px" id="riskTag">SCALE —</span>
      <div class="duel" id="riskSeats"></div>
    </div>
  </section>

  <!-- decision desk -->
  <section class="panel">
    <div class="room wood">
      <span class="plate"><span class="d">◆</span> 결정 데스크 <span class="d">◆</span></span>
      <div class="duel" id="decisionSeats"></div>
    </div>
    <div class="body">
      <div class="verdict hidden" id="verdict"></div>
    </div>
  </section>

  <!-- flow -->
  <section class="panel">
    <span class="plate"><span class="d">◆</span> 수급 · 외국인 / 기관 / 개인 <span class="d">◆</span></span>
    <div class="body" id="flowBody"><div class="empty">수급 데이터 없음 — config 의 flow.provider 를 설정하세요</div></div>
  </section>

  <!-- feed -->
  <section class="panel">
    <span class="plate"><span class="d">◆</span> 이벤트 로그 <span class="d">◆</span></span>
    <div class="body"><div class="feed" id="feed"></div></div>
  </section>

</div>

<footer>
  읽기 전용 화면입니다. 시작·정지는 CLI 전용.
  과거 성과는 예측이 아니며, 매매에는 원금 손실 위험이 있습니다.
</footer>

<div class="tape"><div class="tape-in" id="tape"></div></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const token = new URLSearchParams(location.search).get("token") || "";
const auth = token ? {Authorization: "Bearer " + token} : {};
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = (n, d = 0) => n == null || !isFinite(n) ? "—"
  : Number(n).toLocaleString(undefined, {minimumFractionDigits: d, maximumFractionDigits: d});
const pct = n => n == null || !isFinite(n) ? "—" : (n >= 0 ? "+" : "") + Number(n).toFixed(2) + "%";
const cls = n => n > 0 ? "up" : n < 0 ? "down" : "";
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ── pixel sprites ───────────────────────────────────────────────────── */
const SPRITE = [
  "..HHHHHH..",
  ".HHHHHHHH.",
  ".HFFFFFFH.",
  ".FFEFFEFF.",
  ".FFFFFFFF.",
  "..FFMMFF..",
  "...SSSS...",
  "..SSSSSS..",
  ".KSSSSSSK.",
  "KKSSSSSSKK",
  ".KSSSSSSK.",
  "..SSSSSS..",
  "..PP..PP..",
  "..PP..PP..",
];
const PALETTE = {H:"hair", F:"#f2c9a0", E:"#20160e", M:"#b8724f", S:"shirt", K:"#f2c9a0", P:"#2b3244"};

function sprite(hair, shirt) {
  const px = 4, w = SPRITE[0].length, h = SPRITE.length;
  let r = `<svg class="avatar" viewBox="0 0 ${w * px} ${h * px}" aria-hidden="true">`;
  SPRITE.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === ".") return;
    let c = PALETTE[ch];
    if (c === "hair") c = hair; else if (c === "shirt") c = shirt;
    r += `<rect x="${x * px}" y="${y * px}" width="${px}" height="${px}" fill="${c}"/>`;
  }));
  // desk monitor glow
  r += `<rect x="${px * 2}" y="${px * (h - 2)}" width="${px * 6}" height="${px * 2}" fill="#12331f"/>`;
  r += `<rect x="${px * 3}" y="${px * (h - 2) + 2}" width="${px * 4}" height="${px * 2 - 4}" fill="#57d977"/>`;
  return r + "</svg>";
}

/* ── seats ───────────────────────────────────────────────────────────── */
const ANALYSTS = [
  {key: "technical",      name: "TARO",   role: "기술적 분석", hair: "#2f4fa8", shirt: "#3b6fd4"},
  {key: "flow",           name: "FLUX",   role: "수급 분석",   hair: "#7a3fa0", shirt: "#a45fd0"},
  {key: "fundamental",    name: "DIANA",  role: "펀더멘털",    hair: "#a0642f", shirt: "#d99a4e"},
  {key: "news",           name: "NOVA",   role: "뉴스·공시",   hair: "#2f8f7a", shirt: "#3fb99e"},
  {key: "sentiment",      name: "ECHO",   role: "센티먼트",    hair: "#8f2f6a", shirt: "#c94f9a"},
  {key: "macro",          name: "ATLAS",  role: "매크로",      hair: "#5a5f6b", shirt: "#8a91a0"},
  {key: "microstructure", name: "MICRO",  role: "미시구조",    hair: "#8a6a1f", shirt: "#c9a53c"},
  {key: "quant",          name: "SIGMA",  role: "퀀트",        hair: "#1f5f6a", shirt: "#2f8fa0"},
];
const DEBATERS = [
  {key: "bull", name: "BULL", role: "강세론자", hair: "#1d6b38", shirt: "#2f9c52"},
  {key: "bear", name: "BEAR", role: "약세론자", hair: "#7a1f1a", shirt: "#c33a31"},
];
const RISKERS = [
  {key: "risk_aggressive",   name: "BLAZE",  role: "공격형", hair: "#8a2f1a", shirt: "#d9622f"},
  {key: "risk_conservative", name: "WARDEN", role: "보수형", hair: "#2f3a4a", shirt: "#4f5f7a"},
  {key: "risk_neutral",      name: "JUDGE",  role: "중립·판정", hair: "#3a4a6a", shirt: "#5f7bb0"},
];
const DECIDERS = [
  {key: "research_manager", name: "SAGE",  role: "리서치 매니저", hair: "#4a2f6a", shirt: "#7f5fb0"},
  {key: "trader",           name: "BLITZ", role: "트레이더",      hair: "#1a4a6a", shirt: "#2f8fd0"},
  {key: "head",             name: "CHIEF", role: "데스크 헤드",   hair: "#5a3a1a", shirt: "#e0b040"},
];

function seatHtml(s) {
  return `<div class="seat idle" id="seat-${s.key}">
      <div class="bubble neutral" id="bub-${s.key}"><b>${esc(s.name)}</b><span></span></div>
      <div class="avatar-wrap">${sprite(s.hair, s.shirt)}</div>
      <div class="desk"></div>
      <div class="seatname px">${esc(s.name)}</div>
      <div class="role">${esc(s.role)}</div>
    </div>`;
}
$("#analystSeats").innerHTML = ANALYSTS.map(seatHtml).join("");
$("#debateSeats").innerHTML =
  seatHtml(DEBATERS[0]) + `<div class="vs px">VS</div>` + seatHtml(DEBATERS[1]);
$("#riskSeats").innerHTML =
  seatHtml(RISKERS[0]) + `<div class="vs px">⇄</div>` + seatHtml(RISKERS[1]) +
  `<div class="vs px">→</div>` + seatHtml(RISKERS[2]);
$("#decisionSeats").innerHTML = DECIDERS.map(seatHtml).join("");

const ALL_KEYS = [...ANALYSTS, ...DEBATERS, ...RISKERS, ...DECIDERS].map(s => s.key);

function say(key, text, tone) {
  const seat = document.getElementById("seat-" + key);
  const bub = document.getElementById("bub-" + key);
  if (!seat || !bub) return;
  // One speaker at a time. Bubbles are wider than a seat, so two at once
  // overlap into an unreadable pile — and a desk where everyone talks
  // simultaneously is not a deliberation.
  ALL_KEYS.forEach(k => {
    const other = document.getElementById("seat-" + k);
    if (other && k !== key) other.classList.remove("talking");
  });
  bub.className = "bubble " + (tone || "neutral");
  bub.querySelector("span").textContent = text || "";
  seat.classList.remove("idle");
  seat.classList.add("active", "talking");
}
function hush(key) {
  const seat = document.getElementById("seat-" + key);
  if (seat) seat.classList.remove("talking");
}
function resetFloor() {
  ALL_KEYS.forEach(k => {
    const s = document.getElementById("seat-" + k);
    if (s) { s.classList.add("idle"); s.classList.remove("active", "talking"); }
  });
  $("#roundTag").textContent = "ROUND —";
  $("#riskTag").textContent = "SCALE —";
}

/* ── deliberation replay ─────────────────────────────────────────────── */
const TONE = {bullish: "bull", bearish: "bear", neutral: "neutral"};
let playing = false;

async function playDeliberation(d, opts) {
  if (playing) return;
  playing = true;
  const speed = (opts && opts.speed) || 1;
  const wait = ms => sleep(ms * speed);
  try {
    resetFloor();
    $("#verdict").classList.add("hidden");
    $("#deskSubject").textContent =
      (opts && opts.demo ? "DEMO · " : "") + (d.symbol || "—") + " 심의 중";

    // 1) 분석 8석 — each states its read in turn
    for (const a of ANALYSTS) {
      const r = (d.analysts || {})[a.key];
      if (!r) continue;
      const line = !r.data_sufficient
        ? "데이터 부족 — 판단 보류"
        : ((r.key_points || [])[0] || r.stance || "");
      say(a.key, `[${r.stance || "?"} ${Math.round((r.conviction || 0) * 100)}%] ${line}`,
          TONE[r.stance] || "neutral");
      await wait(850);
    }
    await wait(450);

    // 2) 강세 vs 약세, round by round
    const rounds = (d.debate && d.debate.rounds) || [];
    for (let i = 0; i < rounds.length; i++) {
      $("#roundTag").textContent = `ROUND ${i + 1}/${rounds.length}`;
      for (const side of ["bull", "bear"]) {
        const r = rounds[i][side];
        if (!r) continue;
        hush(side === "bull" ? "bear" : "bull");
        say(side, r.argument || "", side);
        await wait(1800);
      }
    }
    hush("bull"); hush("bear");
    await wait(300);

    // 3) 리스크 위원회 — aggressive vs conservative, then the neutral verdict
    const riskRounds = (d.risk_debate && d.risk_debate.rounds) || [];
    for (let i = 0; i < riskRounds.length; i++) {
      for (const side of ["aggressive", "conservative"]) {
        const key = side === "aggressive" ? "risk_aggressive" : "risk_conservative";
        const r = riskRounds[i][side];
        if (!r) continue;
        const scale = Math.round((r.proposed_scale || 0) * 100);
        say(key, `배율 ${scale}% — ${r.argument || ""}`,
            side === "aggressive" ? "bull" : "bear");
        await wait(1600);
      }
    }
    if (d.risk) {
      const scale = Math.round((d.position_scale || 0) * 100);
      $("#riskTag").textContent = d.vetoed ? "VETO" : `SCALE ${scale}%`;
      say("risk_neutral",
          (d.vetoed ? "⛔ 거부: " + (d.veto_reason || "") : `최종 배율 ${scale}% — `) +
          (d.risk.reasoning || ""),
          d.vetoed ? "bear" : "neutral");
      await wait(1800);
    }
    hush("risk_aggressive"); hush("risk_conservative");

    // 4) 결정 데스크 — plan, then execution, then the call
    if (d.plan) {
      say("research_manager",
          `[${d.plan.rating || "?"}] ${d.plan.rationale || ""}`,
          (d.plan.rating || "").includes("buy") ? "bull"
            : (d.plan.rating || "").includes("sell") ? "bear" : "neutral");
      await wait(1700);
    }
    if (d.trade) {
      say("trader",
          `${d.trade.entry_style || ""} ${d.trade.tranches ? "· " + d.trade.tranches + "분할" : ""} — ${d.trade.execution_note || ""}`,
          "neutral");
      await wait(1600);
    }
    say("head", `${(d.action || "hold").toUpperCase()} · 확신 ${Math.round((d.conviction || 0) * 100)}% — ${d.rationale || ""}`,
        (d.action || "").includes("buy") ? "bull"
          : (d.action || "").includes("sell") || (d.action || "") === "reduce" ? "bear" : "neutral");
    renderVerdict(d, opts && opts.demo);
    $("#deskSubject").textContent = (opts && opts.demo ? "DEMO · " : "") +
      (d.symbol || "—") + " 결정 완료";
  } finally {
    playing = false;
  }
}

  sell: ["매도", "var(--down)"], strong_sell: ["적극 매도", "var(--down)"],
};

function renderVerdict(d, demo) {

  const v = $("#verdict");
  v.classList.remove("hidden");

    <div class="act px" style="color:${color}">${d.vetoed ? "거부" : esc(label)}</div>
    <div class="meta">
      ${esc(d.symbol || "")}<br>
      확신 ${Math.round((d.conviction || 0) * 100)}% · 합의 ${(d.consensus >= 0 ? "+" : "")}${(d.consensus || 0).toFixed(2)}<br>
      투표 ${d.voting_seats != null ? d.voting_seats : "—"}/8석 · 반대 ${Math.round((d.dissent_ratio || 0) * 100)}%<br>
      배율 ${Math.round((d.position_scale || 0) * 100)}% · ${d.horizon_bars || "—"}봉<br>
      <span class="dim">${(d.elapsed_s || 0).toFixed(1)}s · ${d.llm_calls || 0} calls</span>

      ${d.dissent ? `<em style="margin-top:8px">반대 의견</em>${esc(d.dissent)}` : ""}

/* ── data plumbing ───────────────────────────────────────────────────── */
async function api(path) {
  const r = await fetch(path, {headers: auth});
  if (!r.ok) throw new Error(r.status + " " + path);
  return r.json();
}

let equity = [];
function drawEquity() {
  const c = $("#equity"), ctx = c.getContext("2d");
  const dpr = devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  c.width = w * dpr; c.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  if (equity.length < 2) {
    ctx.fillStyle = "#7b8494"; ctx.font = '10px Silkscreen, monospace';
    ctx.textAlign = "center"; ctx.fillText("NO EQUITY HISTORY", w / 2, h / 2);
    return;
  }
  const vals = equity.map(p => p.equity);
  const lo = Math.min(...vals), hi = Math.max(...vals), pad = (hi - lo) * .1 || 1;
  const X = i => (i / (equity.length - 1)) * (w - 2) + 1;
  const Y = v => h - 6 - (v - lo + pad) / (hi - lo + pad * 2) * (h - 12);
  // high-water line so drawdown is visible, not inferred
  let peak = -Infinity;
  ctx.beginPath();
  equity.forEach((p, i) => { peak = Math.max(peak, p.equity);
    i ? ctx.lineTo(X(i), Y(peak)) : ctx.moveTo(X(i), Y(peak)); });
  ctx.strokeStyle = "#2a3140"; ctx.lineWidth = 1; ctx.stroke();
  const up = vals[vals.length - 1] >= vals[0];
  ctx.beginPath();
  equity.forEach((p, i) => i ? ctx.lineTo(X(i), Y(p.equity)) : ctx.moveTo(X(i), Y(p.equity)));
  ctx.strokeStyle = up ? "#57d977" : "#ff5a52"; ctx.lineWidth = 2; ctx.stroke();
}

function renderHud(p) {
  if (!p) return;
  $("#hudEquity").textContent = num(p.equity, 0) + (p.currency === "KRW" ? "" : "");
  const ch = $("#hudChange");
  ch.textContent = pct(p.total_return_pct);
  ch.className = "chg " + cls(p.total_return_pct);
  $("#hudSym").textContent = "PORTFOLIO · " + (p.currency || "");
  const items = [
    ["CASH", num(p.cash, 0), ""],
    ["DRAWDOWN", pct(-Math.abs(p.drawdown_pct || 0)), p.drawdown_pct > 10 ? "down" : ""],
    ["미실현", num(p.unrealized_pnl, 0), cls(p.unrealized_pnl)],
    ["보유", p.open_positions, ""],
    ["매매", p.closed_trades, ""],
    ["수수료", num(p.total_fees, 0), ""],
  ];
  $("#hudKpis").innerHTML = items.map(([k, v, c]) =>
    `<div class="kpi"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`).join("");

  const tb = $("#positions").querySelector("tbody");
  tb.innerHTML = (p.positions || []).length
    ? `<tr><th>종목</th><th class="num">수량</th><th class="num">평단</th><th class="num">현재가</th><th class="num">손익</th></tr>` +
      p.positions.map(x => `<tr><td class="gold">${esc(x.symbol)}</td>
        <td class="num">${num(x.quantity, 4)}</td><td class="num">${num(x.avg_price, 2)}</td>
        <td class="num">${num(x.last_price, 2)}</td>
        <td class="num ${cls(x.unrealized_pct)}">${pct(x.unrealized_pct)}</td></tr>`).join("")
    : `<tr><td class="empty">보유 없음</td></tr>`;
}

function renderFlow(data) {
  const box = $("#flowBody");
  if (!data || !data.available) {
    box.innerHTML = `<div class="empty">${esc((data && data.message) ||
      "수급 데이터 없음 — config 의 flow.provider 를 설정하세요")}</div>`;
    return;
  }
  const rows = Object.entries(data.symbols || {}).filter(([, v]) => v.summary);
  if (!rows.length) { box.innerHTML = `<div class="empty">수급 데이터 대기 중</div>`; return; }
  box.innerHTML = rows.map(([ticker, v]) => {
    const s = v.summary;
    const trio = [
      ["외국인", s.foreign_net_qty], ["기관", s.institution_net_qty], ["개인", s.retail_net_qty],
    ];
    const scale = Math.max(...trio.map(t => Math.abs(t[1])), 1);
    return `<div class="flowrow">
      <div class="flowsym">${esc(ticker)}<br><span class="dim" style="font-size:8px">${esc(s.divergence)}</span></div>
      <div class="bars">
        ${trio.map(([n, q]) => {
          const h = Math.max(Math.abs(q) / scale * 100, 3);
          const c = q >= 0 ? "#57d977" : "#ff5a52";
          return `<span class="lbl">${n}</span>
            <span class="b" title="${n} ${num(q)}"><i style="height:${h}%;background:${c}"></i></span>`;
        }).join("")}
        <span class="lbl">${s.foreign_streak >= 0 ? "+" : ""}${s.foreign_streak}일</span>
      </div></div>`;
  }).join("");
}

function renderTape(symbols) {
  if (!symbols || !symbols.length) return;
  const one = symbols.map(s =>
    `<span><b>${esc(s.ticker)}</b><span class="${cls(s.change_pct)}">${num(s.price, 2)} ${pct(s.change_pct)}</span></span>`
  ).join("");
  $("#tape").innerHTML = one + one;   // duplicated so the marquee loops seamlessly
}

const feed = $("#feed");
function pushEvent(e) {
  const p = e.payload || {};
  let msg = "", tone = "";
  switch (e.type) {
    case "order_filled":
      msg = `${p.side} ${p.quantity} ${p.symbol} @ ${p.price}`;
      tone = p.side === "buy" ? "up" : "down"; break;
    case "trade_closed":
      msg = `${p.symbol} ${pct(p.pnl_pct)} (${num(p.pnl, 0)})`; tone = cls(p.pnl); break;
    case "protection":
      msg = `${p.protection} · ${p.symbol} · ${p.reason}`; tone = "gold"; break;
    case "order_rejected":
      msg = `${p.symbol}: ${p.reject_reason || p.reason}`; tone = "down"; break;
    case "deliberation":
      msg = `${p.symbol} → ${p.action} (${Math.round((p.conviction || 0) * 100)}%)`;
      tone = "gold"; break;
    case "insight":
      msg = `${p.symbol} ${p.direction} ${p.source} — ${p.tag || ""}`; break;
    case "equity": return;
    default: msg = JSON.stringify(p).slice(0, 140);
  }
  const div = document.createElement("div");
  div.innerHTML = `<span class="t">${esc((e.ts || "").slice(11, 19))}</span>
    <span class="ty ${tone}">${esc(e.type)}</span><span class="m">${esc(msg)}</span>`;
  feed.prepend(div);
  while (feed.childNodes.length > 150) feed.lastChild.remove();
}

/* ── polling + stream ────────────────────────────────────────────────── */
async function refresh() {
  try {
    const h = await api("/api/health");
    $("#conn").className = "conn " + (h.trader_running ? "on" : "off");
  } catch { $("#conn").className = "conn off"; }

  try {
    const s = await api("/api/status");
    if (s.portfolio) {
      $("#strategy").textContent = s.strategy || "—";
      const m = $("#mode");
      m.textContent = (s.mode || "offline").replace("_", " ").toUpperCase();
      m.className = "mode px " + (s.mode === "live" ? "" : s.mode === "dry_run" ? "dry" : "backtest");
      renderHud(s.portfolio);
    }
  } catch {}

  try { equity = (await api("/api/equity?limit=1200")).points || []; drawEquity(); } catch {}
  try { renderTape((await api("/api/universe")).symbols); } catch {}
  try { renderFlow(await api("/api/flow")); } catch {}

  // Replay the newest deliberation we have not shown yet.
  try {
    const d = await api("/api/desk?limit=1");
    const latest = (d.deliberations || [])[0];
    if (latest && latest.decided_at !== lastShown) {
      lastShown = latest.decided_at;
      playDeliberation(latest, {speed: .55});
    }
  } catch {}
}
let lastShown = null;

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws${token ? "?token=" + token : ""}`);
  ws.onmessage = m => {
    let e; try { e = JSON.parse(m.data); } catch { return; }
    if (e.type === "equity") { renderHud(e.payload); return; }
    if (e.type === "deliberation") {
      lastShown = (e.payload || {}).decided_at;
      playDeliberation(e.payload);
    }
    pushEvent(e);
  };
  // A dashboard that silently goes stale is worse than one that says it is offline.
  ws.onclose = () => { $("#conn").className = "conn off"; setTimeout(connect, 4000); };
  ws.onopen = () => setInterval(() => ws.readyState === 1 && ws.send("ping"), 25000);
}
